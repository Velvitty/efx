:root {
  --bg: #080608;
  --bg2: #0f0d10;
  --panel: #13111a;
  --panel2: #1c1825;
  --border: #2a2535;
  --border-hi: #4a3f6b;
  --amber: #ffb300;
  --amber-dim: #7a5500;
  --green: #39ff14;
  --green-dim: #1a5c08;
  --red: #ff3355;
  --blue: #00cfff;
  --purple: #c77dff;
  --text: #d4c9e8;
  --muted: #5a4f6e;
  --vu-bg: #0a0808;
  /* 글꼴 크기 단계 — 화면의 모든 작은 글자는 역할에 따라 이 넷 중 하나를 쓴다 */
  --fs-tick: 0.6875rem;  /* 11px  눈금·작은 표지 */
  --fs-xs:   0.75rem;    /* 12px  보조 설명·배지 */
  --fs-sm:   0.8125rem;  /* 13px  라벨·값·버튼 */
  --fs-md:   0.875rem;   /* 14px  강조 */
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: &#x27;Rajdhani&#x27;, sans-serif;
  font-weight: 300;
  min-height: 100vh;
  cursor: default;
}

/* Scanline overlay */
body::after {
  content: &#x27;&#x27;;
  position: fixed;
  inset: 0;
  background: repeating-linear-gradient(
    0deg,
    transparent,
    transparent 2px,
    rgba(0,0,0,0.07) 2px,
    rgba(0,0,0,0.07) 4px
  );
  pointer-events: none;
  z-index: 9999;
}

/* CRT glow BG */
body::before {
  content: &#x27;&#x27;;
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse 80% 50% at 50% 0%, rgba(199,125,255,0.04) 0%, transparent 60%),
    radial-gradient(ellipse 60% 80% at 10% 80%, rgba(255,179,0,0.03) 0%, transparent 50%),
    radial-gradient(ellipse 40% 60% at 90% 20%, rgba(0,207,255,0.03) 0%, transparent 50%);
  pointer-events: none;
  z-index: 0;
}

.app {
  position: relative;
  z-index: 1;
  max-width: 1240px;
  margin: 0 auto;
  padding: 24px 20px 60px;
}

/* ===== HEADER ===== */
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 0 20px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 24px;
}

.logo {
  display: flex;
  align-items: baseline;
  gap: 12px;
}

.logo h1 {
  font-family: &#x27;Orbitron&#x27;, monospace;
  font-size: 1.5rem;
  font-weight: 900;
  color: var(--amber);
  letter-spacing: 0.08em;
  text-shadow: 0 0 20px rgba(255,179,0,0.4);
}

.logo sub {
  font-family: &#x27;Share Tech Mono&#x27;, monospace;
  font-size: var(--fs-xs);
  color: var(--muted);
  letter-spacing: 0.2em;
}

.header-meters {
  display: flex;
  gap: 16px;
  align-items: center;
}

/* VU Meter */
.vu-pair {
  display: flex;
  gap: 3px;
}

.vu-bar {
  width: 8px;
  height: 50px;
  background: var(--vu-bg);
  border: 1px solid var(--border);
  border-radius: 2px;
  overflow: hidden;
  display: flex;
  flex-direction: column-reverse;
  position: relative;
}

.vu-fill {
  width: 100%;
  height: 0%;
  transition: height 0.05s;
  background: linear-gradient(to top, var(--green), #aaff00 70%, var(--amber) 85%, var(--red) 100%);
}

.vu-label {
  font-family: &#x27;Share Tech Mono&#x27;, monospace;
  font-size: var(--fs-xs);
  color: var(--muted);
  text-align: center;
  margin-top: 4px;
}

/* ===== DROP ZONE ===== */
.drop-zone {
  border: 1px solid var(--border);
  border-radius: 3px;
  padding: 36px;
  text-align: center;
  cursor: pointer;
  background: var(--panel);
  margin-bottom: 20px;
  position: relative;
  overflow: hidden;
  transition: all 0.2s;
}

.drop-zone::before {
  content: &#x27;&#x27;;
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(255,179,0,0.03) 0%, transparent 50%);
}

.drop-zone:hover, .drop-zone.over {
  border-color: var(--amber);
  background: rgba(255,179,0,0.04);
}

.drop-icon {
  font-size: 2rem;
  display: block;
  margin-bottom: 10px;
  filter: sepia(1) hue-rotate(20deg);
}

.drop-zone h2 {
  font-family: &#x27;Orbitron&#x27;, monospace;
  font-size: 1rem;
  color: var(--amber);
  letter-spacing: 0.1em;
  margin-bottom: 6px;
}

.drop-zone p {
  font-family: &#x27;Share Tech Mono&#x27;, monospace;
  font-size: var(--fs-sm);
  color: var(--muted);
  letter-spacing: 0.08em;
}

#fileInput { display: none; }

/* ===== FILE INFO ===== */
.file-info {
  display: none;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 3px;
  padding: 12px 16px;
  margin-bottom: 20px;
  align-items: center;
  gap: 12px;
}
.file-info.show { display: flex; }

.fi-led {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--green);
  box-shadow: 0 0 8px var(--green);
  flex-shrink: 0;
  animation: blink 2s infinite;
}
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

.fi-name {
  font-family: &#x27;Share Tech Mono&#x27;, monospace;
  font-size: 0.9375rem;
  color: var(--text);
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.fi-meta {
  font-family: &#x27;Share Tech Mono&#x27;, monospace;
  font-size: var(--fs-sm);
  color: var(--muted);
  flex-shrink: 0;
}

/* ===== SPECTRUM ===== */
.spectrum-wrap {
  display: none;
  margin-bottom: 24px;
}
.spectrum-wrap.show { display: block; }

/* 좌우 2분할 그리드 */
.spectrum-ab {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}

/* ===== X축 범위 고정 스위치 ===== */
.spec-toolbar {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 10px;
  padding: 6px 10px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 3px;
}
.spec-toolbar-label {
  font-family: &#x27;Share Tech Mono&#x27;, monospace;
  font-size: var(--fs-xs);
  letter-spacing: 0.16em;
  color: var(--muted);
}
.spec-toolbar-note {
  font-family: &#x27;Share Tech Mono&#x27;, monospace;
  font-size: var(--fs-xs);
  letter-spacing: 0.08em;
  color: #6a6478;
  margin-left: auto;
}

.axis-switch {
  position: relative;
  width: 196px;
  padding-top: 2px;
}
/* 노치 트랙 — |--|--|--| 모양을 배경 그라데이션으로 그린다 */
.axis-switch::before {
  content: &#x27;&#x27;;
  position: absolute;
  left: 7px; right: 7px; top: 8px;
  height: 2px;
  background: var(--border);
  border-radius: 1px;
  pointer-events: none;
}
.axis-switch::after {
  content: &#x27;&#x27;;
  position: absolute;
  left: 7px; right: 7px; top: 4px;
  height: 10px;
  pointer-events: none;
  /* 4개 눈금 기둥 — 내부 폭 182px 기준 60px 간격으로 0/60/120/180 지점 */
  background: repeating-linear-gradient(
    to right,
    var(--border) 0 2px,
    transparent 2px 60px
  );
}
.axis-switch input[type=range] {
  -webkit-appearance: none;
  appearance: none;
  position: relative;
  z-index: 1;
  width: 100%;
  height: 18px;
  margin: 0;
  background: transparent;
  cursor: pointer;
}
.axis-switch input[type=range]::-webkit-slider-runnable-track {
  height: 18px; background: transparent;
}
.axis-switch input[type=range]::-moz-range-track {
  height: 18px; background: transparent;
}
.axis-switch input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 14px; height: 14px;
  margin-top: 2px;
  border-radius: 50%;
  background: var(--amber);
  border: 2px solid #1a1520;
  box-shadow: 0 0 6px rgba(255,179,0,0.5);
}
.axis-switch input[type=range]::-moz-range-thumb {
  width: 14px; height: 14px;
  border-radius: 50%;
  background: var(--amber);
  border: 2px solid #1a1520;
  box-shadow: 0 0 6px rgba(255,179,0,0.5);
}
.axis-switch-ticks {
  display: flex;
  justify-content: space-between;
  margin-top: 1px;
  font-family: &#x27;Share Tech Mono&#x27;, monospace;
  font-size: var(--fs-tick);
  letter-spacing: 0.06em;
  color: #4a4555;
}
.axis-switch-ticks span { width: 34px; display: flex; flex-direction: column; align-items: center; white-space: nowrap; }   /* 숫자 아래 둘째 줄에 (원본) */
.axis-switch-ticks span small { font-size: 0.85em; line-height: 1.15; }
.axis-switch-ticks span:first-child { align-items: flex-start; }
.axis-switch-ticks span:last-child { align-items: flex-end; }
.axis-switch-ticks span.on { color: var(--amber); }

/* 모듈 입력 게인 — 이펙트 진입 전 레벨이라 구분선으로 분리 */
.slider-row.in-gain {
  padding-bottom: 8px;
  margin-bottom: 8px;
  border-bottom: 1px dashed var(--border);
}
.slider-row.in-gain .slider-label { color: var(--blue); }

.spec-panel {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 3px;
  padding: 10px 12px 8px;
}
/* 좌(원음)는 차분한 톤, 우(적용본)는 앰버 강조 */
.spec-panel.dry { border-left: 2px solid #4a4555; }
.spec-panel.wet { border-left: 2px solid var(--amber); }

.spec-label {
  font-family: &#x27;Share Tech Mono&#x27;, monospace;
  font-size: var(--fs-sm);
  color: var(--muted);
  letter-spacing: 0.15em;
  margin-bottom: 6px;
  display: flex;
  justify-content: space-between;
  align-items: baseline;
}
.spec-tag.dry { color: #6a6478; }
.spec-tag.wet { color: var(--amber); }
.spec-peak {
  font-size: var(--fs-xs);
  color: var(--muted);
  letter-spacing: 0.08em;
}

/* 클릭 전환 모드 배지 */
.spec-mode {
  font-family: &#x27;Share Tech Mono&#x27;, monospace;
  font-size: var(--fs-tick);
  letter-spacing: 0.12em;
  color: #6a6478;
  border: 1px solid var(--border);
  border-radius: 2px;
  padding: 1px 6px;
  margin-left: auto;
  margin-right: 10px;
  user-select: none;
  transition: color 0.25s ease, border-color 0.25s ease;
}
.spec-panel.wet .spec-mode.active { color: var(--amber); border-color: var(--amber); }
.spec-panel.dry .spec-mode.active { color: #78c0d8; border-color: #4a6a78; }

.spec-panel canvas {
  display: block;
  width: 100%;
  height: 150px;
  background: #050305;
  border: 1px solid var(--border);
  border-radius: 2px;
  cursor: pointer;
  transition: border-color 0.2s ease;
}
.spec-panel canvas:hover { border-color: #6a5a80; }

/* 주파수 눈금 */
.spec-axis {
  position: relative;
  height: 15px;
  font-family: &#x27;Share Tech Mono&#x27;, monospace;
  font-size: var(--fs-tick);
  color: #4a4555;
  letter-spacing: 0.05em;
  margin-top: 4px;
  padding: 0 2px;
}
/* 주파수 눈금 — 로그 위치에 정확히 놓기 위해 절대 배치 */
.spec-axis .ftick {
  position: absolute;
  top: 0;
  white-space: nowrap;
  transform: translateX(-50%);
}
.spec-axis .ftick.first { transform: none; }
.spec-axis .ftick.last  { transform: translateX(-100%); }
.spec-axis .ftick.nyq   { color: var(--amber); }
/* 시간축·범례는 기존처럼 양끝 정렬 */
.spec-axis.flow {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

/* 스펙트로그램 음압 컬러 범례 */
.sg-legend {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.sg-legend-bar {
  display: inline-block;
  width: 84px;
  height: 7px;
  border: 1px solid var(--border);
  border-radius: 2px;
}

/* 좁은 화면에서는 세로로 */
@media (max-width: 900px) {
  .spectrum-ab { grid-template-columns: 1fr; }
}

/* ===== TRANSPORT ===== */
.transport-bar {
  display: none;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 3px;
  padding: 16px 20px;
  margin-bottom: 24px;
}
.transport-bar.show { display: block; }

.transport-controls {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 12px;
}

.btn {
  font-family: &#x27;JetBrains Mono&#x27;, &#x27;Orbitron&#x27;, monospace;
  font-size: var(--fs-sm);
  letter-spacing: 0.08em;
  padding: 8px 16px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text);
  border-radius: 2px;
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
}
.btn:hover { border-color: var(--amber); color: var(--amber); }
.btn.active { border-color: var(--amber); color: var(--amber); background: rgba(255,179,0,0.08); }
.btn.danger { border-color: var(--red); color: var(--red); }
.btn.danger:hover { background: rgba(255,51,85,0.1); }
.btn.export { border-color: var(--blue); color: var(--blue); }
.btn.export:hover { background: rgba(0,207,255,0.08); }
.btn:disabled { opacity: 0.3; cursor: not-allowed; }

.progress-outer {
  height: 4px;
  background: var(--border);
  border-radius: 2px;
  cursor: pointer;
  margin-bottom: 8px;
  position: relative;
}
.progress-inner {
  height: 100%;
  background: linear-gradient(to right, var(--amber-dim), var(--amber));
  border-radius: 2px;
  width: 0%;
  transition: width 0.1s linear;
}
.time-row {
  display: flex;
  justify-content: space-between;
  font-family: &#x27;Share Tech Mono&#x27;, monospace;
  font-size: var(--fs-sm);
  color: var(--muted);
}

/* ===== DSP GRID ===== */
.dsp-section-title {
  font-family: &#x27;Share Tech Mono&#x27;, monospace;
  font-size: var(--fs-sm);
  color: var(--muted);
  letter-spacing: 0.2em;
  text-transform: uppercase;
  margin-bottom: 12px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 8px;
}

.dsp-section-title::before {
  content: &#x27;▸&#x27;;
  color: var(--amber);
}

.dsp-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
  gap: 14px;
  margin-bottom: 24px;
}

/* ===== MODULE CARD ===== */
.module {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 3px;
  overflow: hidden;
  transition: border-color 0.2s;
}
.module.on { border-color: var(--border-hi); }

.module-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 14px;
  background: var(--panel2);
  border-bottom: 1px solid var(--border);
}

.module-name {
  font-family: &#x27;Orbitron&#x27;, monospace;
  font-size: var(--fs-sm);
  font-weight: 700;
  letter-spacing: 0.1em;
  color: var(--muted);
  transition: color 0.2s;
}
.module.on .module-name { color: var(--amber); }

.module-sub {
  font-family: &#x27;Share Tech Mono&#x27;, monospace;
  font-size: var(--fs-xs);
  color: var(--muted);
  margin-left: 8px;
  opacity: 0.7;
}

/* HD · Ultra · eXtreme HD 컬럼 헤더 — 제목 + LIVE 토글 */
.hd-cols {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}
.hd-col-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 10px;
}
.hd-live-toggle {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  cursor: pointer;
  user-select: none;
}
.hd-live-toggle &gt; span:first-child {
  font-family: &#x27;Share Tech Mono&#x27;, monospace;
  font-size: var(--fs-tick);
  letter-spacing: 0.14em;
  color: #6a6478;
}
.hd-live-toggle:has(input:checked) &gt; span:first-child { color: var(--amber); }
.hd-live-toggle:has(input:disabled) { opacity: 0.4; cursor: not-allowed; }

/* 실시간 복원 활성 시 모듈 강조 */
#mod-hd.live-active { border-color: var(--amber); }
#hdLiveStatus.on { color: var(--amber); }

.module-header &gt; div:not(.module-header-right) {
  flex-wrap: wrap;       /* 글자가 커져 한 줄에 안 들어가면 부제가 이름 아래로 내려간다 */
  row-gap: 2px;
  min-width: 0;
}
.module-header-right {
  display: flex;
  align-items: center;
  gap: 10px;
}

/* LED Toggle */
.led-toggle {
  position: relative;
  cursor: pointer;
}
.led-toggle input { display: none; }
.led-btn {
  display: block;
  width: 24px; height: 14px;
  background: #1a1520;
  border: 1px solid var(--border);
  border-radius: 7px;
  position: relative;
  transition: background 0.2s;
}
.led-btn::after {
  content: &#x27;&#x27;;
  position: absolute;
  top: 2px; left: 2px;
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--muted);
  transition: all 0.2s;
}
.led-toggle input:checked + .led-btn {
  background: rgba(255,179,0,0.15);
  border-color: var(--amber-dim);
}
.led-toggle input:checked + .led-btn::after {
  left: 12px;
  background: var(--amber);
  box-shadow: 0 0 6px var(--amber);
}

/* Module body */
.module-body {
  padding: 14px;
}

/* Knob row */
.knob-row {
  display: flex;
  gap: 14px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 4px;
}

.knob-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
}

.knob {
  width: 48px; height: 48px;
  position: relative;
  cursor: pointer;
  user-select: none;
}

.knob svg {
  width: 100%; height: 100%;
  transform: rotate(-135deg);
}

.knob-arc-bg { fill: none; stroke: var(--border); stroke-width: 4; }
.knob-arc { fill: none; stroke: var(--amber); stroke-width: 4; stroke-linecap: round; transition: stroke-dashoffset 0.05s; }
.knob.blue .knob-arc { stroke: var(--blue); }
.knob.purple .knob-arc { stroke: var(--purple); }
.knob.green .knob-arc { stroke: var(--green); }
.knob.red .knob-arc { stroke: var(--red); }

.knob-center {
  position: absolute;
  inset: 8px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #2a2535, #0f0d14);
  border: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
}
.knob-dot {
  width: 3px; height: 3px;
  border-radius: 50%;
  background: var(--amber);
  position: absolute;
  top: 22%;
  left: 50%;
  transform: translateX(-50%);
  transition: all 0.05s;
}

.knob-label {
  font-family: &#x27;Share Tech Mono&#x27;, monospace;
  font-size: var(--fs-xs);
  color: var(--muted);
  letter-spacing: 0.05em;
  text-align: center;
}
.knob-value {
  font-family: &#x27;Share Tech Mono&#x27;, monospace;
  font-size: var(--fs-sm);
  color: var(--amber);
  text-align: center;
  min-width: 3em;
}
.knob.blue ~ .knob-value { color: var(--blue); }

/* Slider */
.slider-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 8px;
}
.slider-label {
  font-family: &#x27;Share Tech Mono&#x27;, monospace;
  font-size: var(--fs-sm);
  color: var(--muted);
  width: 8em;             /* 가장 긴 라벨 13자(WOW &amp; FLUTTER)가 한 줄에 */
  flex-shrink: 0;
}
.rp-btn { flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; background: var(--panel2); color: var(--text); border: 1px solid var(--border);
  border-radius: 3px; padding: 5px 8px; font-family: inherit; font-size: var(--fs-sm); cursor: pointer; text-align: left; }
.rp-btn:hover, .rp-btn[aria-expanded=&quot;true&quot;] { border-color: var(--border-hi); }
.rp-btn:focus-visible, .rp-tab:focus-visible, .rp-opt:focus-visible { outline: 2px solid var(--amber); outline-offset: 1px; }
.rp-sum { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rp-sum.custom { color: var(--amber); }
.rp-caret { color: var(--muted); flex-shrink: 0; }
.rp-pop { position: fixed; z-index: 400; width: min(380px, calc(100vw - 16px)); background: var(--panel); border: 1px solid var(--border-hi); border-radius: 4px;
  box-shadow: 0 10px 28px rgba(0,0,0,.35); font-family: inherit; display: none; }
.rp-pop.open { display: block; }
.rp-tabs { display: flex; gap: 2px; overflow-x: auto; border-bottom: 1px solid var(--border); padding: 0 4px; scrollbar-width: thin; }
.rp-tab { flex-shrink: 0; background: none; border: none; border-bottom: 2px solid transparent; color: var(--muted); font-family: inherit; font-size: var(--fs-xs);
  padding: 8px 8px 6px; cursor: pointer; white-space: nowrap; }
.rp-tab[aria-selected=&quot;true&quot;] { color: var(--amber); border-bottom-color: var(--amber); }
.rp-tab .rp-dot { display: inline-block; width: 5px; height: 5px; border-radius: 50%; background: var(--amber); margin-left: 4px; vertical-align: middle; }
.rp-list { padding: 4px; max-height: min(320px, 60vh); overflow-y: auto; }
.rp-opt { display: block; width: 100%; text-align: left; background: none; border: none; border-left: 2px solid transparent; border-radius: 2px; padding: 7px 10px;
  color: var(--text); font-family: inherit; cursor: pointer; }
.rp-opt:hover { background: var(--panel2); }
.rp-opt[aria-checked=&quot;true&quot;] { border-left-color: var(--amber); background: var(--panel2); }
.rp-opt[aria-checked=&quot;true&quot;] .rp-name { color: var(--amber); }
.rp-name { font-size: var(--fs-sm); }
.rp-desc { display: block; color: var(--muted); font-size: var(--fs-xs); margin-top: 2px; line-height: 1.35; }
.rp-foot { border-top: 1px solid var(--border); padding: 6px 10px; color: var(--muted); font-size: var(--fs-xs); line-height: 1.4; }
.slider-val {
  font-family: &#x27;Share Tech Mono&#x27;, monospace;
  font-size: var(--fs-sm);
  color: var(--amber);
  width: 4.8em;           /* 가장 긴 값 8자(120 /min) */
  text-align: right;
  flex-shrink: 0;
}

input[type=range] {
  flex: 1;
  -webkit-appearance: none;
  height: 3px;
  background: var(--border);
  border-radius: 2px;
  outline: none;
  cursor: pointer;
}
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 13px; height: 13px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #ffcc44, var(--amber));
  border: 1px solid rgba(255,179,0,0.5);
  cursor: pointer;
  box-shadow: 0 0 6px rgba(255,179,0,0.4);
  transition: transform 0.1s;
}
input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.3); }

/* Vintage meter */
.vintage-meter {
  height: 6px;
  background: var(--vu-bg);
  border: 1px solid var(--border);
  border-radius: 2px;
  margin-top: 8px;
  overflow: hidden;
}
.vintage-meter-fill {
  height: 100%;
  width: 0%;
  background: linear-gradient(to right, var(--green-dim), var(--green) 60%, var(--amber) 80%, var(--red));
  border-radius: 2px;
  transition: width 0.08s;
}

/* Info badge */
.info-badge {
  font-family: &#x27;Share Tech Mono&#x27;, monospace;
  font-size: var(--fs-xs);
  color: var(--muted);
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 2px;
  padding: 2px 6px;
}

/* HD badge */
.hd-badge {
  font-family: &#x27;Orbitron&#x27;, monospace;
  font-size: var(--fs-tick);   /* 장식용 배지 — 카드 이름 자리를 남긴다 */
  font-weight: 700;
  padding: 3px 8px;
  border-radius: 2px;
  letter-spacing: 0.08em;
}
.hd-badge.hd { background: rgba(0,207,255,0.1); color: var(--blue); border: 1px solid rgba(0,207,255,0.3); }
.hd-badge.uxhd { background: rgba(199,125,255,0.1); color: var(--purple); border: 1px solid rgba(199,125,255,0.3); }

/* HD module */
.hd-module {
  grid-column: 1 / -1;
}

/* Vinyl crackle canvas */
canvas.crackle-vis {
  display: block;
  width: 100%;
  height: 30px;
  border-radius: 2px;
  margin-top: 8px;
  background: #050305;
}


/* ===== TUBE VISUALIZER ===== */
.tube-viz-wrap {
  margin-top: 10px;
  position: relative;
}
.tube-viz-label-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 4px;
}
.tube-viz-label {
  font-family: &#x27;Share Tech Mono&#x27;, monospace;
  font-size: var(--fs-xs);
  color: var(--muted);
  letter-spacing: 0.08em;
}
.tube-viz-thd {
  font-family: &#x27;Share Tech Mono&#x27;, monospace;
  font-size: var(--fs-sm);
  color: var(--amber);
  letter-spacing: 0.05em;
  transition: color 0.2s;
}
.tube-viz-thd.hot { color: var(--red); }
canvas.tube-vis {
  display: block;
  width: 100%;
  height: auto;       /* attribute 비율(560:72) 유지 */
  border-radius: 2px;
  background: #04030a;
  border: 1px solid #1a1428;
}
/* Saturation bar under the canvas */
.tube-sat-bar-wrap {
  margin-top: 5px;
  display: flex;
  align-items: center;
  gap: 7px;
}
.tube-sat-bar-label {
  font-family: &#x27;Share Tech Mono&#x27;, monospace;
  font-size: var(--fs-tick);
  color: var(--muted);
  white-space: nowrap;
  letter-spacing: 0.06em;
  min-width: 2.8em;
}
.tube-sat-bar-bg {
  flex: 1;
  height: 5px;
  background: #0e0c14;
  border-radius: 3px;
  overflow: hidden;
  border: 1px solid #1e1a2e;
}
.tube-sat-bar-fill {
  height: 100%;
  border-radius: 3px;
  width: 0%;
  transition: width 0.08s linear, background 0.2s;
  background: linear-gradient(to right, #ffb300, #ff7700);
}
.tube-sat-bar-fill.hot {
  background: linear-gradient(to right, #ff7700, #ff3355);
}
.tube-sat-val {
  font-family: &#x27;Share Tech Mono&#x27;, monospace;
  font-size: var(--fs-tick);
  color: var(--amber);
  min-width: 2.6em;
  text-align: right;
}

/* ===== EXPORT ROW ===== */
.export-section {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 3px;
  padding: 16px 20px;
  margin-bottom: 20px;
}
.export-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));   /* 가장 긴 버튼(약 264px)이 들어가게 */
  gap: 10px;
}
.export-btn-wrap {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.export-btn-wrap span {
  font-family: &#x27;JetBrains Mono&#x27;, &#x27;Share Tech Mono&#x27;, monospace;
  font-size: var(--fs-xs);
  color: var(--muted);
  letter-spacing: 0.05em;
}

/* ===== SOUNDGOODIZER MODE BUTTONS ===== */
.sg-mode-btn,
.atmos-scene-btn {
  font-family: &#x27;Orbitron&#x27;, monospace;
  font-size: var(--fs-sm);
  font-weight: 700;
  letter-spacing: 0.1em;
  width: 32px; height: 28px;
  border: 1px solid var(--border);
  background: var(--bg2);
  color: var(--muted);
  border-radius: 2px;
  cursor: pointer;
  transition: all 0.15s;
}
.sg-mode-btn:hover, .atmos-scene-btn:hover { border-color: var(--amber); color: var(--amber); }
.sg-mode-btn.active, .atmos-scene-btn.active {
  border-color: var(--amber);
  color: var(--bg);
  background: var(--amber);
  box-shadow: 0 0 10px rgba(255,179,0,0.4);
}

/* ===== STATUS ===== */
.status-bar {
  font-family: &#x27;Share Tech Mono&#x27;, monospace;
  font-size: var(--fs-sm);
  color: var(--muted);
  letter-spacing: 0.05em;
  padding: 8px 0;
  min-height: 28px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.status-bar.ok { color: var(--green); }
.status-bar.warn { color: var(--amber); }
.status-bar.err { color: var(--red); }
.status-led {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: currentColor;
  flex-shrink: 0;
  box-shadow: 0 0 6px currentColor;
}

/* ===== PROCESSING ===== */
.overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(5,3,8,0.95);
  z-index: 1000;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 20px;
}
.overlay.show { display: flex; }
/* 오버레이 내부 전체를 1/1.5 배율로 */
.overlay &gt; * { transform: scale(0.833); transform-origin: center center; }

.overlay-title {
  font-family: &#x27;Orbitron&#x27;, monospace;
  font-size: 1.6rem;
  color: var(--amber);
  letter-spacing: 0.2em;
  text-align: center;
}
.overlay-sub {
  font-family: &#x27;Share Tech Mono&#x27;, monospace;
  font-size: 1.1rem;
  color: var(--muted);
  letter-spacing: 0.1em;
  text-align: center;
  max-width: 640px;
}
/* overlay log */
.overlay-log {
  position: relative;
  display: flex;
  flex-direction: column;
  gap: 0;
  min-width: 600px;
  max-width: 700px;
  /* 4.5줄 고정: 1줄 = 2em + 8px padding ≈ 38px, 4.5줄 = 171px */
  height: 171px;
  overflow: hidden;
  will-change: contents;
  margin-top: -8px;
}
/* 마지막 0.5줄(~19px)을 그라데이션으로 페이드아웃 */
.overlay-log::after {
  content: &#x27;&#x27;;
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 38px; /* 1줄 높이 — 아래쪽 절반부터 완전 불투명으로 */
  background: linear-gradient(to bottom, transparent 0%, rgba(5,3,8,0.97) 55%);
  pointer-events: none;
  z-index: 2;
  will-change: transform;
}
.overlay-log-line {
  font-family: &#x27;JetBrains Mono&#x27;, &#x27;Share Tech Mono&#x27;, monospace;
  font-size: 0.95rem;
  letter-spacing: 0.04em;
  text-align: left;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  opacity: 0;
  max-height: 0;
  padding-bottom: 0;
  transform: translateY(-14px);
  transition: opacity 0.38s ease-out,
              transform 0.38s cubic-bezier(0.16,1,0.3,1),
              max-height 0.38s ease,
              padding-bottom 0.38s ease,
              color 0.5s ease;
}
.overlay-log-line.visible {
  opacity: 1;
  transform: translateY(0);
  max-height: 2em;
  padding-bottom: 8px;
}
.overlay-log-line.exiting {
  opacity: 0 !important;
  transform: translateY(20px) !important;
  max-height: 0 !important;
  padding-bottom: 0 !important;
  transition: opacity 0.45s ease-in,
              transform 0.45s ease-in,
              max-height 0.45s ease,
              padding-bottom 0.45s ease !important;
}
.overlay-log-line.current { color: var(--amber); }
.overlay-log-line.past    { color: #4a4555; }

.progress-bar-big {
  position: relative;
  width: 640px;
  height: 5px;
  background: var(--border);
  border-radius: 3px;
}
.progress-bar-pct {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-family: &#x27;JetBrains Mono&#x27;, &#x27;Orbitron&#x27;, monospace;
  font-size: 0.85rem;
  font-weight: 700;
  letter-spacing: 0.1em;
  color: #fff;
  text-shadow: 0 0 10px var(--amber), 0 0 3px rgba(0,0,0,0.9);
  pointer-events: none;
  white-space: nowrap;
  mix-blend-mode: screen;
  line-height: 1;
  margin-top: -18px;
}
.progress-bar-big-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--amber-dim) 0%, var(--amber) 50%, var(--amber-dim) 100%);
  background-size: 200% 100%;
  border-radius: 2px;
  width: 0%;
  transition: none;
  animation: prog-shimmer 1.6s linear infinite;
}
@keyframes prog-shimmer {
  0%   { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}

@media (max-width: 640px) {
  .dsp-grid { grid-template-columns: 1fr; }
  .hd-module { grid-column: 1; }
  .hd-cols { grid-template-columns: 1fr; }   /* 좁은 화면에서는 HD · Ultra · eXtreme HD를 위아래로 */
}

/* ===== EULA MODAL ===== */
.eula-overlay {

.eula-header {

}
.eula-header-top {

}
.eula-title {

}
.eula-subtitle {
  font-family: &#x27;Share Tech Mono&#x27;, monospace;
  font-size: var(--fs-xs);
  color: var(--muted);
  letter-spacing: 0.1em;
}
.eula-version {
  font-family: &#x27;Share Tech Mono&#x27;, monospace;
  font-size: var(--fs-xs);
  color: var(--muted);
  margin-top: 2px;
}

.eula-body {

  overflow-y: auto;

.eula-body::-webkit-scrollbar { width: 5px; }
.eula-body::-webkit-scrollbar-track { background: var(--bg2); }
.eula-body::-webkit-scrollbar-thumb { background: var(--border-hi); border-radius: 3px; }

.eula-preamble {
  font-family: &#x27;Share Tech Mono&#x27;, monospace;
  font-size: var(--fs-sm);
  color: var(--muted);
  line-height: 1.8;
  margin-bottom: 22px;

}

.eula-section {
  margin-bottom: 20px;
}
.eula-section-num {
  font-family: &#x27;Orbitron&#x27;, monospace;
  font-size: var(--fs-xs);
  font-weight: 700;
  color: var(--amber);
  letter-spacing: 0.15em;
  margin-bottom: 6px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.eula-section-num::after {

}
.eula-section-title {
  font-family: &#x27;Rajdhani&#x27;, sans-serif;
  font-weight: 600;
  font-size: 0.9375rem;
  color: var(--text);
  margin-bottom: 8px;
}
.eula-section-title .ko {
  font-size: var(--fs-md);
  color: var(--muted);
  font-weight: 400;
  margin-left: 6px;
}
.eula-section-body {
  font-family: &#x27;Share Tech Mono&#x27;, monospace;
  font-size: var(--fs-sm);
  color: var(--muted);
  line-height: 1.85;
}
.eula-section-body .ko-text {
  display: block;
  color: #7a6f8a;
  margin-top: 5px;
  font-size: var(--fs-sm);
  padding-left: 8px;

}
.eula-highlight {
  color: var(--amber);
  font-weight: 600;
}
.eula-warn {
  color: var(--red);
}

.eula-consent-notice {
  margin-top: 24px;
  padding: 14px 16px;
  background: rgba(255,179,0,0.05);
  border: 1px solid var(--amber-dim);
  border-radius: 3px;
  font-family: &#x27;Share Tech Mono&#x27;, monospace;
  font-size: var(--fs-sm);
  color: var(--amber);

}

.eula-footer {
  padding: 16px 24px;
  background: var(--panel2);
  border-top: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}
.eula-footer-copy {
  font-family: &#x27;Share Tech Mono&#x27;, monospace;

.eula-btn-group {

.eula-btn-decline {

  border: 1px solid var(--border);

.eula-btn-decline:hover { border-color: var(--red); color: var(--red); }
.eula-btn-accept {
  font-family: &#x27;Orbitron&#x27;, monospace;
  font-size: var(--fs-sm);
  letter-spacing: 0.1em;
  padding: 8px 20px;
  border: 1px solid var(--amber);
  background: rgba(255,179,0,0.1);
  color: var(--amber);
  border-radius: 2px;
  cursor: pointer;
  transition: all 0.15s;
  box-shadow: 0 0 10px rgba(255,179,0,0.1);
