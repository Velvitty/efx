.eula-btn-accept:hover {
  background: var(--amber);
  color: var(--bg);
  box-shadow: 0 0 20px rgba(255,179,0,0.3);
}

/* Upload consent badge on drop zone */
.eula-consent-badge {
  font-family: &#x27;Share Tech Mono&#x27;, monospace;
  font-size: var(--fs-xs);
  color: var(--amber-dim);
  margin-top: 8px;
  letter-spacing: 0.04em;
  display: block;
}

/* ── Drag &amp; Drop ── */
.module[draggable=true] { cursor: grab; }
.module[draggable=true]:active { cursor: grabbing; }
.module.dragging  { opacity: 0.35; }

/* 드래그 핸들: 6점 그리드 패턴 */
.drag-handle {
  display: inline-flex; align-items: center; justify-content: center;
  width: 20px; height: 100%; margin-right: 6px;
  user-select: none; cursor: grab; flex-shrink: 0;
  opacity: 0.28;
  transition: opacity 0.15s;
  padding: 0 2px;
  /* 6점 도트 그리드 */
  background-image:
    radial-gradient(circle, var(--muted) 1.2px, transparent 1.2px);
  background-size: 5px 5px;
  background-position: 0 0;
  background-repeat: repeat;
  border-radius: 2px;
  min-height: 28px;
}
.drag-handle:hover {
  opacity: 0.85;
  background-image: radial-gradient(circle, var(--amber) 1.2px, transparent 1.2px);
}
/* 드래그 가능한 모듈 헤더: 좌측 테두리 강조 */
.module[draggable=true] &gt; .module-header {
  border-left: 3px solid rgba(255,180,0,0.18);
  padding-left: 11px;
  transition: border-color 0.2s;
}
.module[draggable=true]:hover &gt; .module-header {
  border-left-color: rgba(255,180,0,0.55);
}
#mod-master .drag-handle { display: none; }
#mod-master &gt; .module-header { border-left: none; padding-left: 14px; }
/* 드롭 위치 표시선 */
.drop-indicator {
  width: 3px;
  align-self: stretch;
  min-height: 60px;
  background: var(--amber);
  border-radius: 2px;
  margin: 0 -1px;
  box-shadow: 0 0 8px var(--amber), 0 0 2px var(--amber);
  pointer-events: none;
  flex-shrink: 0;
}

/* 문서로 나가는 이동 바 */

/* ===== 공통 상단 툴바 — 전 문서 동일 ===== */
.hub-nav{
  /* 콘솔 이동 바 — 프로그램과 같은 판과 글꼴. 컴퓨터가 라이트 모드면 아래에서 밝게 바꾼다 */
  --hn-bg:rgba(41,51,60,.94); --hn-line:#3a4652; --hn-home:#f0b545; --hn-home-hi:#f6c464;
  --hn-link:#aab5bd; --hn-link-hi:#ece3cf; --hn-hover:#303b45; --hn-sep:#52606d; --hn-mark:#f0b545;
  position:sticky; top:0; z-index:9000;
  display:flex; align-items:center; gap:2px; flex-wrap:wrap;
  padding:7px 16px; min-height:34px;
  background:var(--hn-bg); border-bottom:1px solid var(--hn-line);
  font-family:&#x27;Barlow Condensed&#x27;,&#x27;Bahnschrift SemiCondensed&#x27;,&#x27;Bahnschrift&#x27;,&#x27;Avenir Next Condensed&#x27;,&#x27;Roboto Condensed&#x27;,&#x27;DejaVu Sans Condensed&#x27;,&#x27;Arial Narrow&#x27;,&#x27;Noto Sans KR&#x27;,&#x27;Apple SD Gothic Neo&#x27;,&#x27;Malgun Gothic&#x27;,sans-serif;
  font-size:13px; font-weight:500; letter-spacing:.02em; line-height:1.5;
  backdrop-filter:saturate(140%) blur(8px);
  -webkit-backdrop-filter:saturate(140%) blur(8px);
}
/* 링크 규칙에는 :root:not(#_)를 붙인다 — 문서의 콘솔 층이 본문 링크를 같은 접두어로 앰버로 칠하므로,
   접두어가 없으면 이동 바 링크까지 앰버가 된다(프로그램에서는 늘 맞아떨어져 달라지는 것이 없다) */
:root:not(#_) .hub-nav .home{ color:var(--hn-home); font-weight:600; letter-spacing:.06em; text-decoration:none; margin-right:12px; white-space:nowrap; }
:root:not(#_) .hub-nav .home:hover{ color:var(--hn-home-hi); }
:root:not(#_) .hub-nav a.hn{ color:var(--hn-link); text-decoration:none; padding:3px 9px; border-radius:6px; white-space:nowrap; }
:root:not(#_) .hub-nav a.hn:hover{ color:var(--hn-link-hi); background:var(--hn-hover); }
:root:not(#_) .hub-nav a.hn[aria-current]{ color:var(--hn-link-hi); background:var(--hn-hover); box-shadow:inset 0 -2px 0 var(--hn-mark); }
.hub-nav .sep{ color:var(--hn-sep); }
.hub-nav a:focus-visible{ outline:2px solid var(--hn-home); outline-offset:1px; }
@media (prefers-color-scheme: light){
  :root:not([data-theme=&quot;dark&quot;]) .hub-nav{
    --hn-bg:rgba(238,241,243,.94); --hn-line:#c2cad1; --hn-home:#835208; --hn-home-hi:#6a4200;
    --hn-link:#46525c; --hn-link-hi:#1c242b; --hn-hover:#e4e8eb; --hn-sep:#9faab4; --hn-mark:#eeae3d;
  }
}
:root[data-theme=&quot;light&quot;] .hub-nav{
  --hn-bg:rgba(238,241,243,.94); --hn-line:#c2cad1; --hn-home:#835208; --hn-home-hi:#6a4200;
  --hn-link:#46525c; --hn-link-hi:#1c242b; --hn-hover:#e4e8eb; --hn-sep:#9faab4; --hn-mark:#eeae3d;
}
/* 화면 색 고르기 — 오른쪽 끝의 자동 · 야간 · 주간. 고른 단추는 현재 문서 표시와 같은 앰버 밑줄 */
.hub-nav .hn-theme{ margin-left:auto; display:inline-flex; align-items:stretch; border:1px solid var(--hn-line); border-radius:7px; overflow:hidden; }
.hub-nav .hn-theme-btn{ -webkit-appearance:none; appearance:none; font:inherit; letter-spacing:inherit; color:var(--hn-link); background:transparent; border:0; margin:0; padding:1px 10px; cursor:pointer; white-space:nowrap; }
.hub-nav .hn-theme-btn + .hn-theme-btn{ border-left:1px solid var(--hn-line); }
.hub-nav .hn-theme-btn:hover{ color:var(--hn-link-hi); background:var(--hn-hover); }
.hub-nav .hn-theme-btn[aria-pressed=&quot;true&quot;]{ color:var(--hn-link-hi); background:var(--hn-hover); box-shadow:inset 0 -2px 0 var(--hn-mark); }
.hub-nav .hn-theme-btn:focus-visible{ outline:2px solid var(--hn-home); outline-offset:-2px; }
@media print{ .hub-nav{ display:none; } }

/* 앵커 이동 시 sticky 툴바에 가리지 않도록 여백 확보 */
[id]{ scroll-margin-top: 46px; }

/* ===== 이탈 확인 모달 ===== */
.leave-overlay{
  position:fixed; inset:0; z-index:9500;
  background:rgba(4,3,8,.9);
  display:none; align-items:center; justify-content:center; padding:20px;
  backdrop-filter:blur(3px);
}
.leave-overlay.show{ display:flex; }
.leave-box{
  width:100%; max-width:460px;
  background:var(--panel); border:1px solid var(--border-hi); border-radius:4px;
  box-shadow:0 0 60px rgba(255,179,0,.07), 0 0 120px rgba(0,0,0,.8);
  overflow:hidden;
}
.leave-head{
  padding:16px 22px; border-bottom:1px solid var(--border);
  background:linear-gradient(90deg, rgba(255,179,0,.07), transparent);
  font-family:&#x27;Orbitron&#x27;,sans-serif; font-weight:700; font-size:14px;
  color:var(--amber); letter-spacing:.05em;
}
.leave-body{ padding:20px 22px; font-size:14px; line-height:1.75; color:var(--text); }
.leave-body .sub{ margin-top:10px; font-size:12.5px; color:var(--muted); }
.leave-body .dest{
  margin-top:12px; font-family:&#x27;Share Tech Mono&#x27;,monospace; font-size:12px;
  color:var(--blue); word-break:break-all;
}
.leave-foot{
  display:flex; gap:10px; justify-content:flex-end;
  padding:14px 22px; border-top:1px solid var(--border); background:var(--bg2);
}
.leave-btn{
  font-family:&#x27;Share Tech Mono&#x27;,monospace; font-size:12px; letter-spacing:.06em;
  padding:8px 18px; border-radius:3px; cursor:pointer;
  background:transparent; border:1px solid var(--border-hi); color:var(--text);
  transition:border-color .15s ease, color .15s ease, background .15s ease;
}
.leave-btn:hover{ border-color:var(--muted); }
.leave-btn.go{ border-color:var(--amber-dim); color:var(--amber); }
.leave-btn.go:hover{ background:rgba(255,179,0,.1); border-color:var(--amber); }

/* ===== 프리셋 ===== */
.preset-section{
  background:var(--panel); border:1px solid var(--border);
  border-radius:4px; padding:16px 18px; margin-bottom:22px;
}
.preset-row{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
.preset-row + .preset-row{ margin-top:12px; padding-top:12px; border-top:1px dashed var(--border); }
.preset-label{
  font-family:&#x27;Share Tech Mono&#x27;,monospace; font-size: var(--fs-xs); letter-spacing:0.14em;
  color:var(--muted); min-width:6em;
}
.btn.preset{
  font-size: var(--fs-sm); padding:7px 14px;
  border-color:var(--border-hi); color:var(--text); background:transparent;
}
.btn.preset:hover:not(:disabled){ border-color:var(--blue); color:var(--blue); }
.slot-btn{
  font-family:&#x27;Share Tech Mono&#x27;,monospace; font-size: var(--fs-xs); letter-spacing:0.06em;
  padding:6px 12px; border:1px solid var(--border); border-radius:3px;
  background:transparent; color:var(--muted); cursor:pointer;
  transition:border-color .15s, color .15s;
}
.slot-btn:hover{ border-color:var(--amber); color:var(--amber); }
.slot-btn.filled{ border-color:var(--green-dim); color:var(--green); }
.slot-btn.filled:hover{ border-color:var(--green); }
/* 복사 모드 */
.slot-btn.copying{ border-color:var(--blue); color:var(--blue); background:rgba(0,207,255,.08); }
.slot-btn.src{ border-color:var(--amber); color:var(--amber); background:rgba(255,179,0,.12); }
.slot-btn.erasing{ border-color:var(--red); color:var(--red); background:rgba(255,51,85,.08); }
.slot-btn.armed{ border-color:var(--red); color:var(--red); }
.preset-section.copy-mode .slot-btn[data-slot],
.preset-section.erase-mode .slot-btn[data-slot]{ border-style:dashed; }
.preset-msg{
  font-family:&#x27;Share Tech Mono&#x27;,monospace; font-size: var(--fs-sm); letter-spacing:0.04em;
  min-height:18px; margin-top:12px; padding-top:10px;
  border-top:1px dashed var(--border); color:var(--muted);
  transition:color .15s;
}
.preset-msg.ok{ color:var(--green); }
.preset-msg.warn{ color:var(--amber); }
.preset-msg.err{ color:var(--red); }
.preset-hint{
  font-family:&#x27;Share Tech Mono&#x27;,monospace; font-size: var(--fs-xs);
  color:var(--muted); margin-top:10px; line-height:1.8;
}
.vinyl-group{
  font-family:&#x27;Share Tech Mono&#x27;,monospace; font-size: var(--fs-xs); letter-spacing:0.16em;
  color:var(--muted); margin:12px 0 4px; padding-top:8px; border-top:1px dashed var(--border);
}
.vinyl-group:first-child{ margin-top:4px; }
/* MASTERING MACRO 0 % 안내 — 크게 만든 곡에서만 MACRO 아래에 뜬다 */
.mz-note { position: relative; margin: -2px 0 10px; padding: 8px 10px; border-left: 2px solid var(--amber); background: color-mix(in srgb, var(--amber) 8%, transparent);
  font-size: var(--fs-xs); line-height: 1.55; color: var(--text, inherit); border-radius: 0 3px 3px 0; }
.mz-note[hidden] { display: none; }
.mz-note p { margin: 0; }
.mz-note p + p { margin-top: 4px; }
.mz-more { all: unset; cursor: pointer; color: var(--amber); text-decoration: underline; text-underline-offset: 2px; white-space: nowrap; margin-left: 2px; }
.mz-more:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; border-radius: 2px; }

/* ============================================================
   디자인 — 야간 콘솔 · 주간 콘솔
   ------------------------------------------------------------
   컴퓨터가 다크 모드면 야간 콘솔, 라이트 모드면 주간 콘솔로 그린다
   (prefers-color-scheme). 색은 모두 역할 이름의 변수로 쓰고, 주간 콘솔은
   변수 값만 바꾼다. 스펙트럼·곡선·미터 같은 계기창은 실제 장비처럼 두
   모드 모두 어둡다. 처리기마다 콘솔 노브 캡처럼 색 하나를 정해 카드 머리 ·
   신호 흐름 노드 · 슬라이더 채움에 똑같이 쓴다. 글자 색은 쓰이는 모든
   바탕에서 대비 4.5:1 이상이 되도록 골랐다. 이 층은 모양만 바꾸며
   표시·숨김과 배치 동작은 위의 규칙이 그대로 맡는다.
   ============================================================ */
:root {
  color-scheme: dark;

  /* 면 */
  --bg: #1f272e;          /* 샤시 */
  --bg2: #182026;         /* 오목한 칸 */
  --panel: #29333c;       /* 앞판 */
  --panel2: #303b45;      /* 앞판 윗단 */
  --border: #3a4652;      /* 판의 이음매 */
  --border-hi: #52606d;

  /* 글자 */
  --text: #ece3cf;        /* 상아색 각인 */
  --muted: #aab5bd;       /* 보조 각인 */
  --dim: #9ca6ae;         /* 곁말 — 안내 · 축 눈금 */
  --num-off: #9ca6ae;     /* 꺼진 노드의 번호 */
  --ink: #161c21;         /* 밝은 면 위 글자 */
  --on-amber: #161c21;    /* 앰버 면 위 글자 */
  --on-cap: #161c21;      /* 캡 색 면 위 글자 */
  --cap-ink: 50%;         /* 캡 색 글자 = 캡을 이만큼, 나머지는 본문 글자색 */
  --cap-tint: 12%;        /* 꺼진 번호 배지 바탕의 캡 비율 */

  /* 신호 색 — 글자와 선 */
  --amber: #f0b545;       /* VU 백라이트 · 값 */
  --amber-dim: #8a6a2a;
  --red: #eb8c7c;
  --green: #86d39a;
  --green-dim: #3e6e4b;
  --blue: #6fb6e8;
  --purple: #b198ec;
  --tag-dry: #9cc3d6;     /* 원음 표지 */
  --tag-dry-edge: #5d8193;
  --danger-edge: #7a3a2f;
  --danger-text: #f08a77;

  /* 앰버 면 — 재생 단추 · 진행 막대 */
  --amber-fill: #f0b545;
  --amber-fill-hi: #f6c464;
  --amber-deep: #c98f2c;
  --amber-glow: rgba(240,181,69,0.8);

  /* 계기창 — 두 모드 공통으로 어둡다 */
  --vu-bg: #11171c;
  --screen: #0d1216;
  --screen-edge: #0a0e11;
  --screen-hover: #33404b;

  /* 조작 요소 */
  --track: #151b20;       /* 슬라이더 홈 */
  --thumb: #ece3cf;       /* 슬라이더 손잡이 */
  --led-off: #3b4751;     /* 꺼진 불빛 */
  --wire: #5a6874;        /* 신호 흐름 전선 */
  --hover-bg: #1b242b;    /* 파일 자리 위에 올렸을 때 */
  --hover-panel: #36424d;
  --press-hi: rgba(255,255,255,0.05);

  /* 빛과 그늘 */
  --chassis-glow: #2b3640;
  --hilite: rgba(255,255,255,0.035);          /* 앞판 윗모서리 반사 */
  --shade: rgba(0,0,0,0.55);                  /* 손잡이 · 불빛 그늘 */
  --groove: rgba(0,0,0,0.5);                  /* 슬라이더 홈 안쪽 그늘 */
  --lift: 0 10px 24px -12px rgba(0,0,0,0.6);  /* 떠 있는 재생 줄 */
  --drag-shadow: 0 10px 24px rgba(0,0,0,0.5);
  --modal-shadow: 0 30px 80px rgba(0,0,0,0.55);

  /* 덮개 */
  --veil: rgba(24,32,38,0.94);
  --veil-solid: rgba(24,32,38,0.97);
  --veil-clear: rgba(24,32,38,0);
  --modal-veil: rgba(20,27,32,0.97);
  --leave-veil: rgba(20,27,32,0.9);
  --decline-bg: rgba(16,21,25,0.99);
  --transport-bg: rgba(41,51,60,0.94);
  --log-past: #9ca6ae;    /* 진행 기록의 지난 줄 */

  /* 처리기 캡 색 — 앞판에 쓰는 색 */
  --cap-peq: #8bbf62;     /* 잎 초록 */
  --cap-comp: #8da9c4;    /* 강철 파랑 */
  --cap-bbe: #4db6a9;     /* 청록 */
  --cap-tube: #e8904a;    /* 진공관 주황 */
  --cap-exc: #d8bc4c;     /* 황동 */
  --cap-sg: #c977a9;      /* 자두 */
  --cap-vinyl: #c67078;   /* 레코드 레이블 빨강 */
  --cap-atmos: #6c9be0;   /* 홀 파랑 */
  --cap-master: #cfd6dc;  /* 은색 */
  --cap-hd: #a78bea;      /* 복원 보라 */
  /* 계기창 위에 켜지는 캡 색 — 어두운 창이라 두 모드 모두 밝은 값 */
  --lit-peq: #8bbf62; --lit-comp: #8da9c4; --lit-bbe: #4db6a9; --lit-tube: #e8904a; --lit-exc: #d8bc4c; --lit-sg: #c977a9;
  --lit-vinyl: #c67078; --lit-atmos: #6c9be0; --lit-master: #cfd6dc; --lit-hd: #a78bea;
  --cap: var(--amber-fill);
  --cap-lit: #f0b545;

  /* Barlow · Barlow Condensed · Noto Sans KR는 파일 안에 넣었다(바깥 요청 없음). 넣은 글꼴에 없는 글자만 다음 글꼴로 —
     Windows는 DIN 계열 Bahnschrift, macOS는 Avenir Next Condensed, 리눅스는 DejaVu Sans Condensed */
  --font-legend: &#x27;Barlow Condensed&#x27;, &#x27;Bahnschrift SemiCondensed&#x27;, &#x27;Bahnschrift&#x27;, &#x27;Avenir Next Condensed&#x27;, &#x27;Roboto Condensed&#x27;, &#x27;DejaVu Sans Condensed&#x27;, &#x27;Arial Narrow&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, sans-serif;
  --font-body: &#x27;Barlow&#x27;, &#x27;Segoe UI&#x27;, &#x27;Helvetica Neue&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif;

  /* 글꼴 크기 단계 — 좁은 글꼴이라 한 단계씩 올린다 */
  --fs-tick: 0.75rem;     /* 12px */
  --fs-xs: 0.8125rem;     /* 13px */
  --fs-sm: 0.875rem;      /* 14px */
  --fs-md: 0.9375rem;     /* 15px */

  --r-card: 10px;         /* 앞판 */
  --r-screen: 6px;        /* 화면 */
  --r-ctl: 6px;           /* 버튼 */
  --hub-h: 34px;          /* 상단 이동 바 — 스크립트가 실제 높이로 고친다 */
  --transport-h: 0px;
}

/* 주간 콘솔 — 밝은 회청색 앞판에 먹색 각인, 캡은 같은 색상의 깊은 값.
   낮의 스튜디오 콘솔처럼 판은 밝고 계기창은 어둡다. */
@media (prefers-color-scheme: light) {
  :root:not([data-theme=&quot;dark&quot;]) {
    color-scheme: light;
    --bg: #dde2e6; --bg2: #d4dade; --panel: #eef1f3; --panel2: #e4e8eb;
    --border: #c2cad1; --border-hi: #9faab4;
    --text: #1c242b; --muted: #46525c; --dim: #535f6a; --num-off: #545f69;
    --ink: #1c242b; --on-amber: #1c242b; --on-cap: #ffffff;
    --cap-ink: 80%; --cap-tint: 18%;
    --amber: #835208; --amber-dim: #c9a25a; --red: #ab3226; --green: #286a3d; --green-dim: #9ccaa9;
    --blue: #285e9a; --purple: #5e44b8; --tag-dry: #2a647d; --tag-dry-edge: #8fb3c4;
    --danger-edge: #d9a59b; --danger-text: #ab3226;
    --amber-fill: #eeae3d; --amber-fill-hi: #f3bd58; --amber-deep: #d4952b; --amber-glow: rgba(131,82,8,0.35);
    --screen-hover: #56626d;
    --track: #cfd6db; --thumb: #ffffff; --led-off: #bfc8cf; --wire: #97a3ad;
    --hover-bg: #e7ebee; --hover-panel: #d9dfe3; --press-hi: rgba(0,0,0,0.05);
    --chassis-glow: #f4f6f8; --hilite: rgba(255,255,255,0.75); --shade: rgba(30,40,50,0.28); --groove: rgba(30,40,50,0.18);
    --lift: 0 10px 24px -14px rgba(30,40,50,0.35); --drag-shadow: 0 10px 24px rgba(30,40,50,0.28);
    --modal-shadow: 0 30px 80px rgba(30,40,50,0.28);
    --veil: rgba(233,237,240,0.94); --veil-solid: rgba(233,237,240,0.97); --veil-clear: rgba(233,237,240,0);
    --modal-veil: rgba(218,224,228,0.97); --leave-veil: rgba(40,50,58,0.4); --decline-bg: rgba(223,228,232,0.99);
    --transport-bg: rgba(238,241,243,0.94); --log-past: #535f6a;
    --cap-peq: #3d6b22; --cap-comp: #32597b; --cap-bbe: #115f58; --cap-tube: #864215; --cap-exc: #695304; --cap-sg: #87386c;
    --cap-vinyl: #96303d; --cap-atmos: #2b5497; --cap-master: #4c5760; --cap-hd: #5b42ae;
  }
}
/* 문서에 data-theme=&quot;light&quot;를 달면 운영체제 설정과 관계없이 주간 콘솔 */
:root[data-theme=&quot;light&quot;] {
    color-scheme: light;
    --bg: #dde2e6; --bg2: #d4dade; --panel: #eef1f3; --panel2: #e4e8eb;
    --border: #c2cad1; --border-hi: #9faab4;
    --text: #1c242b; --muted: #46525c; --dim: #535f6a; --num-off: #545f69;
    --ink: #1c242b; --on-amber: #1c242b; --on-cap: #ffffff;
    --cap-ink: 80%; --cap-tint: 18%;
    --amber: #835208; --amber-dim: #c9a25a; --red: #ab3226; --green: #286a3d; --green-dim: #9ccaa9;
    --blue: #285e9a; --purple: #5e44b8; --tag-dry: #2a647d; --tag-dry-edge: #8fb3c4;
    --danger-edge: #d9a59b; --danger-text: #ab3226;
    --amber-fill: #eeae3d; --amber-fill-hi: #f3bd58; --amber-deep: #d4952b; --amber-glow: rgba(131,82,8,0.35);
    --screen-hover: #56626d;
    --track: #cfd6db; --thumb: #ffffff; --led-off: #bfc8cf; --wire: #97a3ad;
    --hover-bg: #e7ebee; --hover-panel: #d9dfe3; --press-hi: rgba(0,0,0,0.05);
    --chassis-glow: #f4f6f8; --hilite: rgba(255,255,255,0.75); --shade: rgba(30,40,50,0.28); --groove: rgba(30,40,50,0.18);
    --lift: 0 10px 24px -14px rgba(30,40,50,0.35); --drag-shadow: 0 10px 24px rgba(30,40,50,0.28);
    --modal-shadow: 0 30px 80px rgba(30,40,50,0.28);
    --veil: rgba(233,237,240,0.94); --veil-solid: rgba(233,237,240,0.97); --veil-clear: rgba(233,237,240,0);
    --modal-veil: rgba(218,224,228,0.97); --leave-veil: rgba(40,50,58,0.4); --decline-bg: rgba(223,228,232,0.99);
    --transport-bg: rgba(238,241,243,0.94); --log-past: #535f6a;
    --cap-peq: #3d6b22; --cap-comp: #32597b; --cap-bbe: #115f58; --cap-tube: #864215; --cap-exc: #695304; --cap-sg: #87386c;
    --cap-vinyl: #96303d; --cap-atmos: #2b5497; --cap-master: #4c5760; --cap-hd: #5b42ae;
}

/* 처리기마다 캡 색 — 카드와 신호 흐름 노드가 같은 값을 쓴다 */
#mod-peq,     .flow-node[data-mod=&quot;mod-peq&quot;]     { --cap: var(--cap-peq); --cap-lit: var(--lit-peq); }
#mod-comp,    .flow-node[data-mod=&quot;mod-comp&quot;]    { --cap: var(--cap-comp); --cap-lit: var(--lit-comp); }
#mod-bbe,     .flow-node[data-mod=&quot;mod-bbe&quot;]     { --cap: var(--cap-bbe); --cap-lit: var(--lit-bbe); }
#mod-tube,    .flow-node[data-mod=&quot;mod-tube&quot;]    { --cap: var(--cap-tube); --cap-lit: var(--lit-tube); }
#mod-exciter, .flow-node[data-mod=&quot;mod-exciter&quot;] { --cap: var(--cap-exc); --cap-lit: var(--lit-exc); }
#mod-sg,      .flow-node[data-mod=&quot;mod-sg&quot;]      { --cap: var(--cap-sg); --cap-lit: var(--lit-sg); }
#mod-vinyl,   .flow-node[data-mod=&quot;mod-vinyl&quot;]   { --cap: var(--cap-vinyl); --cap-lit: var(--lit-vinyl); }
#mod-atmos,   .flow-node[data-mod=&quot;mod-atmos&quot;]   { --cap: var(--cap-atmos); --cap-lit: var(--lit-atmos); }
#mod-master,  .flow-node[data-mod=&quot;mod-master&quot;]  { --cap: var(--cap-master); --cap-lit: var(--lit-master); }
#mod-hd,      .flow-node[data-mod=&quot;mod-hd&quot;]      { --cap: var(--cap-hd); --cap-lit: var(--lit-hd); }

/* ── 바탕과 글꼴 ───────────────────────────────────────────── */
html { background: var(--bg); }
body {
  background:
    radial-gradient(1100px 520px at 50% -180px, var(--chassis-glow) 0%, transparent 72%),
    var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  font-weight: 400;
  -webkit-font-smoothing: antialiased;
}
body::after, body::before { display: none; }          /* 주사선·네온 번짐을 걷어 낸다 */
.app, .overlay, .eula-overlay, .leave-overlay, .license-footer { font-family: var(--font-body); }
.app *, .overlay *, .eula-overlay *, .leave-overlay *, .license-footer * { font-family: inherit; }

/* 각인(표지)과 숫자는 좁은 글꼴로 */
.logo h1, .logo sub, .vu-label, .dsp-section-title, .module-name, .slider-label, .slider-val,
.btn, .slot-btn, .preset-label, .spec-toolbar-label, .spec-tag, .spec-mode, .spec-peak, .spec-axis,
.axis-switch-ticks, .time-row, .hd-badge, .info-badge, .vinyl-group, .tube-viz-label, .tube-viz-thd,
.tube-sat-bar-label, .tube-sat-val, .sg-mode-btn, .atmos-scene-btn, .hd-live-toggle &gt; span:first-child,
#hdLiveStatus, .flow, .fi-meta, .drop-zone h2, .overlay-title, .progress-bar-pct, .eula-title,
.eula-section-num, .eula-btn-decline, .eula-btn-accept, .leave-head, .leave-btn, .mod-fold {
  font-family: var(--font-legend);
}
.slider-val, .time-row, .spec-peak, .fi-meta, .tube-viz-thd, .tube-sat-val, .progress-bar-pct,
.info-badge, .flow-num, .spec-axis, #axisRangeNote { font-variant-numeric: tabular-nums; }

.app { max-width: 1240px; padding: 22px 24px 64px; }

/* ── 머리 ─────────────────────────────────────────────────── */
.header { align-items: flex-end; padding: 6px 0 18px; margin-bottom: 20px; border-bottom: 1px solid var(--border); }
.logo { gap: 14px; }
.logo h1 {
  font-size: 2.25rem; font-weight: 700; line-height: 0.9; letter-spacing: 0.01em;
  color: var(--text); text-shadow: none;
}
.logo sub { font-size: var(--fs-xs); font-weight: 500; letter-spacing: 0.08em; color: var(--muted); }
.header-meters { gap: 12px; }
.vu-pair { gap: 4px; }
.vu-bar { width: 10px; height: 48px; background: var(--screen); border: 1px solid var(--screen-edge); border-radius: 3px; }
.vu-fill { background: linear-gradient(to top, #6fcf8a 0%, #c9dd78 58%, #f0b545 80%, #e2553e 100%); }   /* 계기창 안이라 두 모드 공통 */
.vu-label { font-size: var(--fs-tick); letter-spacing: 0.06em; color: var(--muted); }

/* ── 파일 넣기 — 레코드 한 장을 올려놓는 자리 ─────────────── */
.drop-zone {
  display: grid; grid-template-columns: auto 1fr; column-gap: 20px; row-gap: 4px; align-items: center;
  text-align: left; padding: 22px 26px; margin-bottom: 18px;
  background: var(--bg2); border: 1.5px dashed var(--border-hi); border-radius: var(--r-card);
}
.drop-zone::before { display: none; }
.drop-zone:hover, .drop-zone.over { background: var(--hover-bg); border-color: var(--amber); }
.drop-icon {
  grid-row: 1 / span 3; width: 58px; height: 58px; border-radius: 50%; font-size: 0; color: transparent;
  background:
    radial-gradient(circle, var(--amber-fill) 0 4px, #2a1f0c 4.5px 7px, transparent 7.5px),
    repeating-radial-gradient(circle, #1c2328 0 2px, #10151a 2px 4px);
  box-shadow: inset 0 0 0 1px var(--screen-edge), 0 0 0 1px var(--border);   /* 레코드판은 물건이라 두 모드 공통 */
}
.drop-zone.over .drop-icon { animation: disc-spin 1.8s linear infinite; }
@keyframes disc-spin { to { transform: rotate(360deg); } }
.drop-zone h2 { font-size: 1.25rem; font-weight: 600; letter-spacing: 0.02em; color: var(--text); margin: 0; }
.drop-zone p { font-size: var(--fs-sm); letter-spacing: 0; color: var(--muted); }
.eula-consent-badge { font-size: var(--fs-xs); color: var(--dim); }
/* 옛 규칙 가운데 &#x27;클래스+요소&#x27;라 위의 상속 규칙을 이기는 것들 */
.drop-zone p, .leave-body .dest { font-family: var(--font-body); }

.file-info { background: var(--panel); border: 1px solid var(--border); border-radius: var(--r-card); padding: 12px 18px; gap: 14px; }
.fi-led { width: 9px; height: 9px; background: var(--green); box-shadow: 0 0 8px color-mix(in srgb, var(--green) 70%, transparent); }
.fi-name { font-size: 1.0625rem; font-weight: 600; color: var(--text); }
.fi-meta { font-size: var(--fs-sm); color: var(--muted); letter-spacing: 0.02em; }

/* ── 구획 제목 ────────────────────────────────────────────── */
.dsp-section-title {
  font-size: 1.125rem; font-weight: 600; letter-spacing: 0.03em; text-transform: none;
  color: var(--text); margin: 30px 0 12px; padding: 0; border-bottom: none; gap: 12px;
}
.dsp-section-title::before { content: &#x27;&#x27;; width: 8px; height: 8px; border-radius: 2px; background: var(--amber-fill); }
.dsp-section-title::after { content: &#x27;&#x27;; flex: 1; height: 1px; background: var(--border); }

/* ── 스펙트럼 — 앞판에 박힌 두 화면 ───────────────────────── */
.spectrum-wrap { margin-bottom: 20px; }
.spec-toolbar { background: transparent; border: none; padding: 0 2px; margin-bottom: 10px; gap: 16px; }
.spec-toolbar-label { font-size: var(--fs-xs); font-weight: 600; letter-spacing: 0.06em; color: var(--muted); }
.spec-toolbar-note { font-size: var(--fs-xs); letter-spacing: 0.02em; color: var(--dim); }
.axis-switch::before { background: var(--border-hi); }
.axis-switch::after { background: repeating-linear-gradient(to right, var(--border-hi) 0 2px, transparent 2px 60px); }
.axis-switch input[type=range]::-webkit-slider-thumb { background: var(--amber-fill); border: 2px solid var(--bg); box-shadow: none; }
.axis-switch input[type=range]::-moz-range-thumb { background: var(--amber-fill); border: 2px solid var(--bg); box-shadow: none; }
.axis-switch-ticks { color: var(--dim); letter-spacing: 0.02em; }
.spectrum-ab { gap: 16px; }
.spec-panel, .spec-panel.dry, .spec-panel.wet {
  background: var(--panel); border: 1px solid var(--border); border-radius: var(--r-card); padding: 12px 12px 10px;
}
.spec-label { font-size: var(--fs-sm); letter-spacing: 0.04em; color: var(--muted); margin-bottom: 8px; }
.spec-tag { font-weight: 600; }
.spec-tag.dry { color: var(--tag-dry); }
.spec-tag.wet { color: var(--amber); }
.spec-mode { border-radius: 999px; padding: 1px 9px; color: var(--muted); border-color: var(--border-hi); letter-spacing: 0.04em; }
.spec-panel.wet .spec-mode.active { color: var(--amber); border-color: var(--amber); }
.spec-panel.dry .spec-mode.active { color: var(--tag-dry); border-color: var(--tag-dry-edge); }
.spec-peak { color: var(--muted); letter-spacing: 0.02em; }
.spec-panel canvas {
  background: var(--screen); border: 1px solid var(--screen-edge); border-radius: var(--r-screen);
  box-shadow: inset 0 0 0 1px rgba(255,255,255,0.02);
}
.spec-panel canvas:hover { border-color: var(--screen-hover); }
.spec-axis { color: var(--dim); letter-spacing: 0.02em; }
.spec-axis .ftick.nyq { color: var(--amber); }

/* ── 재생 줄 — 스크롤해도 위에 붙어 있다 ─────────────────── */
.transport-bar {
  position: sticky; top: var(--hub-h); z-index: 60;
  background: var(--transport-bg); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
  border: 1px solid var(--border); border-radius: var(--r-card); padding: 12px 16px 10px; margin-bottom: 18px;
  box-shadow: var(--lift);
}
.transport-controls { margin-bottom: 10px; }
.progress-outer { height: 6px; background: var(--track); border-radius: 999px; }
.progress-inner { background: linear-gradient(to right, var(--amber-deep), var(--amber-fill)); border-radius: 999px; }
.time-row { font-size: var(--fs-sm); color: var(--muted); }

/* ── 버튼 ─────────────────────────────────────────────────── */
.btn {
  font-size: var(--fs-sm); font-weight: 600; letter-spacing: 0.04em; padding: 8px 16px;
  background: var(--panel2); border: 1px solid var(--border-hi); border-radius: var(--r-ctl); color: var(--text);
}
.btn:hover { border-color: var(--amber); color: var(--amber); }
.btn.active { background: var(--amber-fill); border-color: var(--amber-fill); color: var(--on-amber); }
.btn.active:hover { background: var(--amber-fill-hi); border-color: var(--amber-fill-hi); color: var(--on-amber); }
.btn.danger { background: transparent; border-color: var(--danger-edge); color: var(--danger-text); }
.btn.danger:hover { background: color-mix(in srgb, var(--red) 12%, transparent); border-color: var(--red); color: var(--red); }
.btn:disabled { opacity: 0.35; }
.spec-toolbar-label, .info-badge { white-space: nowrap; }
.transport-controls { flex-wrap: wrap; }
.info-badge { font-size: var(--fs-xs); background: var(--bg2); border-color: var(--border); border-radius: 999px; padding: 3px 10px; color: var(--muted); }

/* ── 신호 흐름 — 처리 순서를 보고 바꾸는 곳 ───────────────── */
.flow { margin: 0 0 16px; }
.flow-head { display: flex; align-items: baseline; gap: 14px; margin-bottom: 8px; flex-wrap: wrap; }
.flow-hint { font-family: var(--font-body); font-size: var(--fs-xs); color: var(--muted); }
.flow-fold {
  margin-left: auto; font-size: var(--fs-xs); font-weight: 600; letter-spacing: 0.04em; color: var(--muted);
  background: transparent; border: 1px solid var(--border-hi); border-radius: 999px; padding: 4px 12px; cursor: pointer;
}
.flow-fold:hover { color: var(--text); border-color: var(--muted); }
.flow-track {
  position: relative; display: flex; align-items: center; overflow-x: auto; overscroll-behavior-x: contain;
  padding: 14px 12px; background: var(--bg2); border: 1px solid var(--border); border-radius: var(--r-card);
  scrollbar-width: thin; scrollbar-color: var(--border-hi) transparent;
}
.flow-term {
  flex: 0 0 auto; font-size: var(--fs-xs); font-weight: 600; letter-spacing: 0.04em; color: var(--muted);
  padding: 5px 10px; border: 1px dashed var(--border-hi); border-radius: 999px; white-space: nowrap;
}
.flow-step { flex: 1 0 auto; display: flex; align-items: center; min-width: 0; }   /* 들어오는 전선 + 노드 */
.flow-wire {
  flex: 1 0 10px; min-width: 10px; height: 2px;
  background: repeating-linear-gradient(90deg, var(--wire) 0 6px, transparent 6px 10px);
}
.flow.playing .flow-wire { animation: flow-run 0.8s linear infinite; }
@keyframes flow-run { from { background-position: 0 0; } to { background-position: 10px 0; } }
.flow-node {
  --cap: var(--amber);
  flex: 0 0 auto; position: relative; display: inline-flex; align-items: center; gap: 2px;
  background: var(--panel); border: 1px solid var(--border-hi); border-radius: 8px; padding: 2px;
  transition: border-color .15s, background-color .15s, box-shadow .15s;
}
.flow-node.on { border-color: var(--cap); background: color-mix(in srgb, var(--cap) 13%, var(--panel)); }
.flow-led {
  width: 24px; height: 26px; display: grid; place-items: center; padding: 0;
  background: transparent; border: 0; border-radius: 6px; cursor: pointer;
}
.flow-led::before {
  content: &#x27;&#x27;; width: 11px; height: 11px; border-radius: 50%;
  background: var(--led-off); box-shadow: inset 0 1px 2px var(--shade);
}
.flow-led:hover { background: var(--press-hi); }
.flow-node.on .flow-led::before { background: var(--cap); box-shadow: 0 0 9px var(--cap); }
.flow-name {
  display: inline-flex; align-items: baseline; gap: 6px; padding: 4px 9px 4px 2px; white-space: nowrap;
  font-size: var(--fs-sm); font-weight: 600; letter-spacing: 0.05em; color: var(--muted);
  background: transparent; border: 0; border-radius: 6px; cursor: grab; touch-action: none; user-select: none;
}
.flow-node.on .flow-name { color: var(--text); }
.flow-num { font-size: var(--fs-tick); font-weight: 500; color: var(--num-off); }
.flow-node.on .flow-num { color: color-mix(in srgb, var(--cap) var(--cap-ink), var(--text)); }
.flow-node.fixed .flow-name, .flow-node.pre .flow-name { cursor: pointer; }
/* 자리가 고정되어 끌어 옮길 수 없는 노드(앞의 HD 복원 · 끝의 MASTER)는 점선 테두리.
   켜짐과 꺼짐은 불빛과 바탕으로 나타낸다 */
.flow-node.pre, .flow-node.fixed { border-style: dashed; }
.flow-node.pre .flow-dot { width: 22px; height: 26px; display: grid; place-items: center; }
.flow-node.pre:not(.on) { background: transparent; }   /* 꺼짐은 비운 바탕과 회색 점으로 — 글자는 읽히게 둔다 */
.flow-node.pre .flow-dot::before { content: &#x27;&#x27;; width: 9px; height: 9px; border-radius: 2px; background: var(--led-off); transform: rotate(45deg); }
.flow-node.pre.on .flow-dot::before { background: var(--cap); box-shadow: 0 0 9px var(--cap); }
.flow-node.dragging { z-index: 3; opacity: 0.88; box-shadow: var(--drag-shadow); cursor: grabbing; }
.flow-node.dragging .flow-name { cursor: grabbing; }
.flow-slot {                                              /* 놓일 자리 — 떠 있게 그려 배치를 흔들지 않는다 */
  position: absolute; width: 3px; border-radius: 2px; pointer-events: none; z-index: 4;   /* 끄는 노드보다 위 */
  background: var(--amber); box-shadow: 0 0 8px var(--amber-glow);
}
/* 끄는 동안 비켜 가기(한 줄) — 다른 칸이 새 순서의 자리로 미끄러지고, 빈 자리가 놓일 곳을 보여 주므로 자리 표시는 숨긴다 */
.flow.sorting .flow-step:not(.lifted), .flow.sorting .flow-post-mark { transition: transform .3s cubic-bezier(.22, 1, .36, 1); }
.flow.sorting .flow-slot { display: none; }
.flow-step.lifted &gt; .flow-wire { visibility: hidden; }  /* 끄는 노드의 전선 — 그 자리로 다른 칸이 들어온다 */
.flow-step.landing { z-index: 2; }                      /* 놓은 노드는 다른 칸 위로 지나간다 */
@media (prefers-reduced-motion: reduce) { .flow.sorting .flow-step:not(.lifted), .flow.sorting .flow-post-mark { transition: none; } }

/* 폭 맞추기 — 스크립트가 실제 폭을 재서 고른다
   · 기본: 한 줄, 남는 폭은 전선이 나눠 가진다
   · compact: 한 줄이 넘치면 여백과 글자를 줄인다
   · wrap: 그래도 넘치면 여러 줄로 감는다. 누르기 쉽도록 크기는 기본 그대로 둔다 */
.flow.compact .flow-track { padding: 10px 8px; }
.flow.compact .flow-term { padding: 4px 7px; font-size: var(--fs-tick); }
.flow.compact .flow-wire { flex-basis: 5px; min-width: 5px; }
.flow.compact .flow-node { padding: 1px; border-radius: 7px; }
.flow.compact .flow-led { width: 19px; height: 24px; }
.flow.compact .flow-led::before { width: 9px; height: 9px; }
.flow.compact .flow-node.pre .flow-dot { width: 17px; height: 24px; }
.flow.compact .flow-name { gap: 4px; padding: 3px 6px 3px 1px; font-size: var(--fs-xs); letter-spacing: 0.03em; }
.flow.compact .flow-num { font-size: 0.6875rem; }
.flow.wrap .flow-track { flex-wrap: wrap; row-gap: 12px; overflow: visible; }
.flow.wrap .flow-step { flex: 0 0 auto; }
.flow.wrap .flow-wire { flex: 0 0 14px; min-width: 14px; }
/* 터치 화면 — 불빛과 이름의 누름 영역을 넓힌다 */
@media (pointer: coarse) {
  .flow-led { width: 32px; height: 34px; }
  .flow-node.pre .flow-dot { height: 34px; }
  .flow-name { padding-top: 8px; padding-bottom: 8px; }
}
/* 줄 첫머리 — 윗줄에서 꺾여 내려와 노드로 들어가는 전선 */
.flow.wrap .flow-step.row-start &gt; .flow-wire {
  height: 20px; margin-left: 2px; transform: translateY(-10px); background: none;
  border-left: 2px dashed var(--wire); border-bottom: 2px dashed var(--wire); border-bottom-left-radius: 7px;
  animation: none;
}

/* ── 처리기 카드 — 채널 스트립 ─────────────────────────────── */
.dsp-grid { gap: 16px; align-items: start; }   /* 카드는 제 높이만 — 긴 카드 옆에 빈 판이 생기지 않게 */
/* 카드 쌓기 — 4px 행으로 잘게 나누고 카드마다 제 높이만큼 차지한다(스크립트가 행 수를 정한다) */
.dsp-grid.masonry { grid-auto-rows: 4px; row-gap: 0; }
.dsp-grid.masonry &gt; .module { margin-bottom: 16px; }
.dsp-grid.masonry &gt; .drop-indicator { grid-row-end: span 30; min-height: 0; }
.module {
  position: relative; background: var(--panel); border: 1px solid var(--border); border-radius: var(--r-card);
  box-shadow: inset 0 1px 0 var(--hilite);
  scroll-margin-top: calc(var(--hub-h) + var(--transport-h) + 14px);
}
.module::before {
  content: &#x27;&#x27;; position: absolute; left: 0; right: 0; top: 0; height: 3px;
  background: var(--cap); opacity: 0.3; transition: opacity .2s; pointer-events: none; z-index: 1;
}
.module.on::before { opacity: 1; }
.module.on { border-color: color-mix(in srgb, var(--cap) 42%, var(--border)); }
.module.flash { animation: card-flash 1.1s ease-out 1; }
@keyframes card-flash {
  0% { box-shadow: 0 0 0 2px var(--cap), 0 0 26px color-mix(in srgb, var(--cap) 45%, transparent); }
  100% { box-shadow: 0 0 0 0 transparent; }
}
.module-header {
  justify-content: flex-start; gap: 10px; padding: 13px 14px 11px; background: var(--panel2); border-bottom: 1px solid var(--border);
}
.module[draggable=true] &gt; .module-header, #mod-master &gt; .module-header { border-left: none; padding-left: 10px; }
.module-header-right { margin-left: auto; gap: 8px; }
.drag-handle {
  width: 12px; height: 22px; margin-right: 0; padding: 0; opacity: 0.45;
  background-image: radial-gradient(circle, var(--muted) 1.1px, transparent 1.4px); background-size: 6px 6px;
}
.drag-handle:hover { opacity: 0.95; background-image: radial-gradient(circle, var(--text) 1.1px, transparent 1.4px); }
.module-name { font-size: var(--fs-md); font-weight: 700; letter-spacing: 0.06em; color: var(--text); }
.module.on .module-name { color: var(--text); }
.module-name[data-pos]::before {
  content: attr(data-pos); display: inline-block; min-width: 1.7em; margin-right: 8px; padding: 1px 5px;
  border-radius: 4px; text-align: center; letter-spacing: 0; font-variant-numeric: tabular-nums;
  font-size: var(--fs-tick); font-weight: 700;
  color: color-mix(in srgb, var(--cap) var(--cap-ink), var(--text)); background: color-mix(in srgb, var(--cap) var(--cap-tint), var(--panel2));
}
.module.on .module-name[data-pos]::before { color: var(--on-cap); background: var(--cap); }
.module-sub { font-family: var(--font-body); font-size: var(--fs-xs); color: var(--muted); opacity: 1; margin-left: 0; word-break: keep-all; overflow-wrap: anywhere; }
.module-body { padding: 14px 16px 16px; }
.module.folded &gt; .module-body { display: none; }
.module.folded &gt; .module-header { border-bottom-color: transparent; }

/* 접기 단추 */
.mod-fold {
  width: 26px; height: 22px; display: grid; place-items: center; padding: 0; cursor: pointer;
  background: transparent; border: 1px solid transparent; border-radius: 5px; color: var(--muted);
}
.mod-fold:hover { border-color: var(--border-hi); color: var(--text); }
.mod-fold::before {
  content: &#x27;&#x27;; width: 7px; height: 7px; border-right: 2px solid currentColor; border-bottom: 2px solid currentColor;
  transform: translateY(-2px) rotate(45deg); transition: transform .15s;
}
.module.folded .mod-fold::before { transform: translateX(-1px) rotate(-45deg); }

/* 늘이기 단추 — 위아래 꺾쇠 두 개(늘이기), 늘인 카드는 안쪽을 향한 꺾쇠(줄이기). 타일에서 내용이 넘치는 카드 · 늘인 카드에만 보인다 */
.mod-grow {
  width: 22px; height: 22px; display: none; place-items: center; padding: 0; margin-right: -4px; cursor: pointer;
  background: transparent; border: 1px solid transparent; border-radius: 5px; color: var(--muted); position: relative;
}
.mod-grow:hover { border-color: var(--border-hi); color: var(--text); }
.mod-grow:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
.mod-grow::before, .mod-grow::after {
  content: &#x27;&#x27;; position: absolute; left: 50%; width: 6px; height: 6px; margin-left: -4px;
  border-left: 2px solid currentColor; border-top: 2px solid currentColor;
}
.mod-grow::before { top: 3px; transform: rotate(45deg); }
.mod-grow::after { bottom: 3px; transform: rotate(225deg); }
.module.grown .mod-grow::before { top: -1px; transform: rotate(225deg); }
.module.grown .mod-grow::after { bottom: -1px; transform: rotate(45deg); }
.dsp-grid.tiles &gt; .module.fx-ovf:not(.folded) .mod-grow,
.dsp-grid.tiles &gt; .module.grown:not(.folded) .mod-grow { display: grid; }

/* 켜짐 스위치 — 빛나는 사각 단추 */
.led-toggle input {
  display: block; position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer;
}
.led-btn {
  width: 36px; height: 22px; border-radius: 6px; background: var(--bg2); border: 1px solid var(--border-hi);
}
.led-btn::after {
  top: 50%; left: 50%; width: 10px; height: 10px; margin: -5px 0 0 -5px;
  background: var(--led-off); box-shadow: inset 0 1px 2px var(--shade);
}
.led-toggle input:checked + .led-btn { background: color-mix(in srgb, var(--cap) 20%, var(--bg2)); border-color: var(--cap); }
.led-toggle input:checked + .led-btn::after { left: 50%; background: var(--cap); box-shadow: 0 0 9px var(--cap); }
.led-toggle input:focus-visible + .led-btn { outline: 2px solid var(--amber); outline-offset: 2px; }

/* 슬라이더 — 홈 안의 채움이 값을 보여 준다 (0 기준 값은 가운데부터) */
.slider-row { gap: 12px; margin-bottom: 9px; min-height: 22px; }
.slider-label { font-size: var(--fs-sm); font-weight: 500; letter-spacing: 0.04em; color: var(--muted); }
.slider-val { font-size: var(--fs-sm); font-weight: 600; letter-spacing: 0.01em; color: var(--text); }
.slider-row.in-gain { padding-bottom: 10px; margin-bottom: 12px; border-bottom: 1px solid var(--border); }
.slider-row.in-gain .slider-label { color: var(--text); }
input[type=range] {
  height: 4px; border-radius: 999px;
  background: linear-gradient(to right,
    var(--track) 0 var(--lo, 0%), var(--cap) var(--lo, 0%) var(--hi, 0%), var(--track) var(--hi, 0%) 100%);
  box-shadow: inset 0 1px 1px var(--groove);
}
input[type=range]::-webkit-slider-thumb {
  width: 15px; height: 15px; border-radius: 50%; background: var(--thumb); border: 3px solid var(--cap);
  box-shadow: 0 1px 3px var(--shade);
}
input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.15); }
input[type=range]::-moz-range-track { background: transparent; }
input[type=range]::-moz-range-thumb {
  width: 11px; height: 11px; border-radius: 50%; background: var(--thumb); border: 3px solid var(--cap);
  box-shadow: 0 1px 3px var(--shade);
}
input[type=range]:focus-visible { outline: 2px solid var(--amber); outline-offset: 5px; }

.vinyl-group {
  font-size: var(--fs-xs); font-weight: 600; letter-spacing: 0.08em; color: var(--muted);
  border-top: 1px solid var(--border); margin: 14px 0 8px; padding-top: 10px;
}
.vintage-meter { height: 6px; background: var(--screen); border: 1px solid var(--screen-edge); border-radius: 999px; }
.vintage-meter-fill { background: linear-gradient(to right, color-mix(in srgb, var(--cap-lit) 55%, #000), var(--cap-lit)); border-radius: 999px; }   /* 계기창 위라 밝은 캡 */
canvas.crackle-vis, canvas.tube-vis { background: var(--screen); border: 1px solid var(--screen-edge); border-radius: var(--r-screen); }
.tube-viz-label, .tube-sat-bar-label { color: var(--muted); letter-spacing: 0.04em; }
.tube-viz-thd { color: var(--amber); }
.tube-sat-bar-bg { background: var(--track); border-color: var(--border); border-radius: 999px; }

/* 모드 · 장면 단추 — 한 줄짜리 선택 칸 */
.sg-mode-btn, .atmos-scene-btn {
  height: 30px; font-weight: 600; letter-spacing: 0.04em; color: var(--muted);
  background: var(--bg2); border: 1px solid var(--border-hi); border-radius: var(--r-ctl);
}
.sg-mode-btn:hover, .atmos-scene-btn:hover { color: var(--text); border-color: var(--cap); }
.sg-mode-btn.active, .atmos-scene-btn.active { color: var(--on-cap); background: var(--cap); border-color: var(--cap); box-shadow: none; }
#sgModeDesc { font-family: var(--font-body); color: var(--muted); }

/* ── 파라메트릭 EQ — 계기창 그래프 · 대역 단추 · 편집 줄 · 큰 편집 창 ── */
canvas.peq-vis {
  display: block; width: 100%; height: 96px; margin: 2px 0 8px; cursor: crosshair; touch-action: none;
  background: var(--screen); border: 1px solid var(--screen-edge); border-radius: var(--r-screen);
}
canvas.peq-vis:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
canvas.peq-vis.big { height: clamp(220px, 42vh, 430px); margin: 0 0 8px; flex: 0 0 auto; }
.peq-bar { display: flex; align-items: flex-start; gap: 6px; margin-bottom: 6px; }
.peq-chips { flex: 1 1 auto; display: flex; flex-wrap: wrap; gap: 4px; min-width: 0; min-height: 24px; }
.peq-chip, .peq-add, .peq-open, .peq-del {
  height: 24px; min-width: 24px; padding: 0 6px; display: inline-grid; place-items: center; cursor: pointer; user-select: none;
  font-family: var(--font-legend); font-size: var(--fs-xs); font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: 0.02em;
  color: var(--muted); background: var(--bg2); border: 1px solid var(--border-hi); border-radius: var(--r-ctl);
}
.peq-chip:hover, .peq-add:hover:not(:disabled), .peq-open:hover { color: var(--text); border-color: var(--cap); }
.peq-chip.sel { color: var(--on-cap); background: var(--cap); border-color: var(--cap); }
.peq-chip.off { border-style: dashed; }
.peq-chip.off:not(.sel) { color: var(--dim); }
.peq-add { font-size: var(--fs-md); }
.peq-add:disabled { opacity: 0.35; cursor: default; }
.peq-open { padding: 0 10px; letter-spacing: 0.04em; }
.peq-del { width: 24px; padding: 0; background: transparent; }
.peq-table .peq-del { width: 26px; height: 26px; }
.peq-del:hover { color: var(--danger-text); border-color: var(--danger-edge); }
.peq-chip:focus-visible, .peq-add:focus-visible, .peq-open:focus-visible, .peq-del:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
.peq-ed { display: grid; gap: 5px; }
.peq-ed-row { display: flex; align-items: center; gap: 6px; }
.peq-led .led-btn { width: 32px; height: 20px; }
.peq-ed .peq-led .led-btn { height: 18px; }
.peq-ed select, .peq-ed input[type=number], .peq-table select, .peq-table input[type=number] {
  height: 26px; padding: 0 6px; font-family: var(--font-legend); font-size: var(--fs-sm); font-weight: 600; font-variant-numeric: tabular-nums;
  color: var(--text); background: var(--bg2); border: 1px solid var(--border-hi); border-radius: var(--r-ctl);
}
.peq-ed select, .peq-ed input[type=number] { height: 24px; }
.peq-ed select[data-k=&quot;type&quot;] { flex: 1 1 auto; min-width: 0; }
.peq-ed select[data-k=&quot;slope&quot;] { flex: 0 1 104px; min-width: 0; }
.peq-ed input[type=number], .peq-table input[type=number] { -moz-appearance: textfield; appearance: textfield; }
.peq-ed input[type=number] { width: 54px; min-width: 0; }
.peq-ed .peq-num { flex: 0 1 auto; min-width: 0; }
.peq-ed input[type=number]::-webkit-inner-spin-button, .peq-ed input[type=number]::-webkit-outer-spin-button,
.peq-table input[type=number]::-webkit-inner-spin-button, .peq-table input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
.peq-ed :is(select, input):disabled, .peq-table :is(select, input):disabled { opacity: 0.45; }
.peq-ed :is(select, input):focus-visible, .peq-table :is(select, input):focus-visible { outline: 2px solid var(--amber); outline-offset: 1px; }
.peq-ed :is(select, input):hover:not(:disabled), .peq-table :is(select, input):hover:not(:disabled) { border-color: var(--cap); }
.peq-num { display: inline-flex; align-items: center; gap: 4px; font-family: var(--font-legend); font-size: var(--fs-xs); letter-spacing: 0.04em; color: var(--muted); }
.peq-num &gt; i { font-style: normal; }
.peq-empty { margin: 4px 0; font-size: var(--fs-xs); color: var(--muted); }
.peq-help { margin: 6px 0 0; font-size: var(--fs-xs); line-height: 1.4; color: var(--muted); }
.peq-sr { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
html.peq-modal-open { overflow: hidden; }
dialog.peq-modal {
  --cap: var(--cap-peq); --cap-lit: var(--lit-peq);
  width: min(1120px, calc(100vw - 24px)); max-width: none; max-height: calc(100vh - 24px); margin: auto; padding: 0;
  font-family: var(--font-body); color: var(--text); background: var(--panel);
  border: 1px solid var(--border-hi); border-radius: var(--r-card); box-shadow: var(--modal-shadow);
}
dialog.peq-modal::backdrop { background: rgba(8,11,14,0.72); }
.peq-modal-box { display: flex; flex-direction: column; max-height: calc(100vh - 26px); padding: 14px 16px 16px; box-sizing: border-box; }
.peq-modal-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.peq-modal-title { margin: 0; font-family: var(--font-legend); font-size: var(--fs-md); font-weight: 700; letter-spacing: 0.06em; }
.peq-count { font-family: var(--font-legend); font-size: var(--fs-xs); color: var(--muted); font-variant-numeric: tabular-nums; }
.peq-modal-gap { flex: 1 1 auto; }
.peq-modal-head .btn { padding: 6px 12px; }
.peq-modal-head .btn:disabled { cursor: default; }
#peqReset.armed { border-color: var(--danger-edge); color: var(--danger-text); }
.peq-table-wrap { flex: 1 1 auto; min-height: 96px; overflow: auto; margin-top: 10px; border: 1px solid var(--border); border-radius: 8px; }
.peq-table { width: 100%; border-collapse: collapse; font-size: var(--fs-sm); }
.peq-table th, .peq-table td { padding: 5px 8px; text-align: left; white-space: nowrap; border-bottom: 1px solid var(--border); }
.peq-table thead th {
  position: sticky; top: 0; z-index: 1; background: var(--panel2);
  font-family: var(--font-legend); font-size: var(--fs-xs); font-weight: 600; letter-spacing: 0.04em; color: var(--muted);
}
.peq-table tbody th { width: 2.6em; font-family: var(--font-legend); font-weight: 700; font-variant-numeric: tabular-nums; color: var(--muted); }
.peq-table tbody tr:last-child &gt; * { border-bottom: 0; }
.peq-table tr.sel { background: color-mix(in srgb, var(--cap) 13%, transparent); }
.peq-table tr.sel th { color: var(--text); }
.peq-table tr.off :is(select, input[type=number]) { color: var(--muted); }
.peq-table input[type=number] { width: 84px; }

/* ── 모니터 보정 — 재생 줄 단추 · 보정 창 · AutoEQ 가져오기 창 ── */
.mon-btn { display: inline-flex; align-items: center; gap: 7px; padding: 6px 12px; max-width: 100%; }
.mon-dot { flex: 0 0 auto; width: 8px; height: 8px; border-radius: 50%; background: var(--border-hi); }
.mon-btn.on { border-color: var(--amber); }
.mon-btn.on .mon-dot { background: var(--amber); box-shadow: 0 0 7px var(--amber-glow); }
.mon-state { min-width: 0; max-width: 18ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; color: var(--muted); }
.mon-btn.on .mon-state { color: var(--amber); }
.mon-btn:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
/* 비교 · 같은 크기 — 모니터 보정 단추와 같은 모양(켜지면 호박색) */
.cmp-btn, .cmp-match { display: inline-flex; align-items: center; gap: 7px; padding: 6px 12px; max-width: 100%; }
.cmp-dot { flex: 0 0 auto; width: 8px; height: 8px; border-radius: 50%; background: var(--border-hi); }
.cmp-btn.on { border-color: var(--amber); }            /* 견줄 소리를 듣는 중 — 모르고 지나치지 않게 테두리까지 */
.cmp-btn.on .cmp-dot, .cmp-match.on .cmp-dot { background: var(--amber); box-shadow: 0 0 7px var(--amber-glow); }
.cmp-state, .cmp-gain { white-space: nowrap; font-weight: 500; color: var(--muted); font-variant-numeric: tabular-nums; }
.cmp-btn.on .cmp-state { color: var(--amber); }
.cmp-btn:focus-visible, .cmp-match:focus-visible, .cmp-target:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
/* 견줄 소리 — 원음 · 카드 하나 빼고(3.1.9). 고르는 창은 고역 복원 프리셋과 같은 rp-pop */
.cmp-target { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; max-width: 100%; }
.cmp-target-lbl { color: var(--muted); }
.cmp-target-sum { white-space: nowrap; font-weight: 500; }
.cmp-target[aria-expanded=&quot;true&quot;] { border-color: var(--border-hi); }
.cmp-pop { width: min(300px, calc(100vw - 16px)); }
dialog.mon-modal { --cap: var(--amber); width: min(880px, calc(100vw - 24px)); }
dialog.aeq-modal { width: min(720px, calc(100vw - 24px)); }
.mon-row { display: flex; align-items: center; gap: 8px 16px; flex-wrap: wrap; margin: 10px 0 8px; }
.mon-row input {
  height: 28px; padding: 0 8px; font-family: var(--font-legend); font-size: var(--fs-sm); font-weight: 600; font-variant-numeric: tabular-nums;
  color: var(--text); background: var(--bg2); border: 1px solid var(--border-hi); border-radius: var(--r-ctl);
}
.mon-row input:hover { border-color: var(--cap); }
.mon-row input:focus-visible { outline: 2px solid var(--amber); outline-offset: 1px; }
.mon-row input[type=number] { width: 76px; -moz-appearance: textfield; appearance: textfield; }
.mon-row input[type=number]::-webkit-inner-spin-button, .mon-row input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
.mon-name { flex: 1 1 260px; }
.mon-name input { flex: 1 1 auto; min-width: 0; font-family: var(--font-body); font-weight: 500; }
.mon-name input::placeholder, .aeq-text::placeholder { color: var(--dim); opacity: 1; }
canvas.peq-vis.mon-vis { height: clamp(170px, 30vh, 280px); margin: 0; cursor: default; flex: 0 0 auto; }
.mon-warn { min-height: 1.4em; margin: 6px 0 0; font-size: var(--fs-xs); line-height: 1.4; color: var(--muted); }
.mon-warn.bad { color: var(--danger-text); }
.mon-table td { font-family: var(--font-legend); font-weight: 600; font-variant-numeric: tabular-nums; }
.mon-table tr.off td { color: var(--muted); }
.mon-table .peq-empty { font-family: var(--font-body); font-weight: 400; white-space: normal; }
#monClear.armed { border-color: var(--danger-edge); color: var(--danger-text); }
.aeq-text {
  display: block; width: 100%; box-sizing: border-box; min-height: 160px; margin-top: 10px; padding: 8px 10px; resize: vertical;
  font-family: ui-monospace, &#x27;SFMono-Regular&#x27;, Menlo, Consolas, &#x27;Noto Sans Mono&#x27;, monospace; font-size: var(--fs-xs); line-height: 1.5;
  color: var(--text); background: var(--bg2); border: 1px solid var(--border-hi); border-radius: var(--r-ctl);
}
.aeq-text:focus-visible { outline: 2px solid var(--amber); outline-offset: 1px; }
.aeq-foot { display: flex; justify-content: flex-end; margin-top: 10px; }
.aeq-foot .btn { padding: 6px 18px; }
.aeq-foot .btn:disabled { cursor: default; }

/* ── 고해상도 복원 ────────────────────────────────────────── */
.hd-badge { letter-spacing: 0.04em; border-radius: 999px; padding: 2px 9px; white-space: nowrap; }
.hd-badge.hd { background: color-mix(in srgb, var(--blue) 12%, transparent); color: color-mix(in srgb, var(--blue) var(--cap-ink), var(--text)); border: 1px solid color-mix(in srgb, var(--blue) 40%, transparent); }
.hd-badge.uxhd { background: color-mix(in srgb, var(--purple) 12%, transparent); color: color-mix(in srgb, var(--purple) var(--cap-ink), var(--text)); border: 1px solid color-mix(in srgb, var(--purple) 40%, transparent); }
/* ATMOS 머리의 3D SPATIAL — 처리기 색을 따른다 */
.hd-badge.spatial {
  margin-right: 2px; color: color-mix(in srgb, var(--cap) var(--cap-ink), var(--text));
  background: color-mix(in srgb, var(--cap) var(--cap-tint), transparent); border: 1px solid color-mix(in srgb, var(--cap) 45%, transparent);
}
.hd-live-toggle &gt; span:first-child { color: var(--muted); letter-spacing: 0.06em; }
.hd-live-toggle:has(input:checked) &gt; span:first-child { color: var(--amber); }
#mod-hd.live-active { border-color: var(--cap); }
#hdLiveStatus { color: var(--muted); }
#hdLiveStatus.on { color: var(--amber); }
.hd-cols &gt; div { background: var(--bg2); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; }

/* ── 설정 보관 · 내보내기 ─────────────────────────────────── */
.preset-section, .export-section { background: var(--panel); border: 1px solid var(--border); border-radius: var(--r-card); padding: 16px 18px; }
.preset-row + .preset-row { border-top: 1px solid var(--border); }
.preset-label { font-size: var(--fs-xs); font-weight: 600; letter-spacing: 0.04em; color: var(--muted); }
.btn.preset { background: var(--panel2); border-color: var(--border-hi); color: var(--text); }
.btn.preset:hover:not(:disabled) { border-color: var(--blue); color: var(--blue); }
.slot-btn {
  font-size: var(--fs-sm); font-weight: 600; letter-spacing: 0.04em; padding: 7px 14px;
  background: var(--bg2); border: 1px solid var(--border-hi); border-radius: var(--r-ctl); color: var(--muted);
}
.slot-btn:hover { border-color: var(--amber); color: var(--amber); }
.slot-btn.filled { color: var(--green); border-color: var(--green-dim); box-shadow: inset 0 -2px 0 var(--green-dim); }
.slot-btn.filled:hover { border-color: var(--green); }
.preset-msg { border-top: 1px solid var(--border); color: var(--muted); }
.preset-hint { color: var(--dim); }
.export-grid { gap: 12px; }
.export-btn-wrap { gap: 6px; }
.export-btn-wrap .btn { width: 100%; text-align: left; padding: 12px 14px; font-size: var(--fs-md); }
.btn.export { background: var(--panel2); border-color: var(--border-hi); color: var(--text); }
.btn.export:hover:not(:disabled) { background: var(--hover-panel); border-color: var(--amber); color: var(--amber); }
#expHD:not(:disabled) { box-shadow: inset 3px 0 0 var(--blue); }
#expWav:not(:disabled) { box-shadow: inset 3px 0 0 var(--amber); }
.export-btn-wrap span { font-family: var(--font-body); font-size: var(--fs-xs); color: var(--muted); letter-spacing: 0; }
.status-bar { font-size: var(--fs-sm); color: var(--muted); }

/* ── 진행 창 · 사용권 · 이탈 확인 ─────────────────────────── */
.overlay { background: var(--veil); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
.overlay-title { font-weight: 700; letter-spacing: 0.08em; color: var(--text); }
.overlay-sub { color: var(--muted); }
.progress-bar-big { background: var(--track); border-radius: 999px; }
.progress-bar-big-fill { background: linear-gradient(90deg, var(--amber-deep) 0%, var(--amber-fill) 50%, var(--amber-deep) 100%); background-size: 200% 100%; border-radius: 999px; }
/* 옛 규칙의 흰 글자 · 앰버 발광은 밝은 덮개 위에서 보이지 않으므로 본문 글자색으로 */
.progress-bar-pct { color: var(--text); text-shadow: none; }
.overlay-log-line.past { color: var(--log-past); }
.overlay-log::after { background: linear-gradient(to bottom, var(--veil-clear) 0%, var(--veil-solid) 55%); }
.eula-overlay { background: var(--modal-veil); }
.eula-box, .leave-box { border-radius: var(--r-card); border-color: var(--border-hi); box-shadow: var(--modal-shadow); }
.eula-title { font-weight: 700; letter-spacing: 0.06em; color: var(--text); text-shadow: none; }
.eula-section-title .ko { color: var(--text); }
.eula-section-body .ko-text { color: var(--muted); }
.eula-btn-decline, .eula-btn-accept { border-radius: var(--r-ctl); font-weight: 600; letter-spacing: 0.04em; }
.eula-btn-accept { background: var(--amber-fill); border-color: var(--amber-fill); color: var(--on-amber); }
.eula-btn-accept:hover { background: var(--amber-fill-hi); }
.leave-overlay { background: var(--leave-veil); }
.leave-btn { border-radius: var(--r-ctl); }
.license-footer { border-top-color: var(--border); }
.lf-sep { color: var(--dim); }

/* 주간 콘솔 — 밝은 바탕에서 탁하게 번지는 빛은 옅은 고리로 바꾼다 */
@media (prefers-color-scheme: light) {
  :root:not([data-theme=&quot;dark&quot;]) .led-toggle input:checked + .led-btn::after,
  :root:not([data-theme=&quot;dark&quot;]) .flow-node.on .flow-led::before,
  :root:not([data-theme=&quot;dark&quot;]) .flow-node.pre.on .flow-dot::before { box-shadow: 0 0 0 3px color-mix(in srgb, var(--cap) 28%, transparent); }
  :root:not([data-theme=&quot;dark&quot;]) .led-toggle input:checked + .led-btn { background: color-mix(in srgb, var(--cap) 14%, var(--panel)); }
}
:root[data-theme=&quot;light&quot;] .led-toggle input:checked + .led-btn::after,
:root[data-theme=&quot;light&quot;] .flow-node.on .flow-led::before,
:root[data-theme=&quot;light&quot;] .flow-node.pre.on .flow-dot::before { box-shadow: 0 0 0 3px color-mix(in srgb, var(--cap) 28%, transparent); }
:root[data-theme=&quot;light&quot;] .led-toggle input:checked + .led-btn { background: color-mix(in srgb, var(--cap) 14%, var(--panel)); }

/* ── 접근성 ───────────────────────────────────────────────── */
.app :focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) {
  .flow.playing .flow-wire, .drop-zone.over .drop-icon, .module.flash, .fi-led, .progress-bar-big-fill { animation: none; }
}
@media (max-width: 640px) {
  .app { padding: 16px 14px 48px; }
  .logo h1 { font-size: 1.75rem; }
  .drop-zone { grid-template-columns: 1fr; text-align: center; justify-items: center; }
  .drop-icon { grid-row: auto; }
  .transport-bar { position: static; }
}

/* ── 프리셋 저장 표시 ─────────────────────────────────────────
   저장에 성공하면 카드와 흐름 지도 노드 안쪽이 처리기 캡 색으로 두 번 깜빡인다.
   요소는 ui.js가 잠깐 붙였다 뗀다. 접힌 카드는 본문만 숨기므로 여기서도 보인다. */
.save-fx {
  position: absolute; inset: 0; border-radius: inherit; pointer-events: none; z-index: 3; opacity: 0;
  background: color-mix(in srgb, var(--cap) 15%, transparent);
  box-shadow: inset 0 0 0 2px var(--cap), 0 0 22px color-mix(in srgb, var(--cap) 38%, transparent);
}
.flow-node &gt; .save-fx {
  inset: -1px;
  background: color-mix(in srgb, var(--cap) 24%, transparent);
  box-shadow: inset 0 0 0 2px var(--cap), 0 0 12px color-mix(in srgb, var(--cap) 45%, transparent);
}
/* 주간 콘솔 — 번짐 대신 고리 */
@media (prefers-color-scheme: light) {
  :root:not([data-theme=&quot;dark&quot;]) .save-fx,
  :root:not([data-theme=&quot;dark&quot;]) .flow-node &gt; .save-fx { box-shadow: inset 0 0 0 2px var(--cap), 0 0 0 3px color-mix(in srgb, var(--cap) 24%, transparent); }
}
:root[data-theme=&quot;light&quot;] .save-fx,
:root[data-theme=&quot;light&quot;] .flow-node &gt; .save-fx { box-shadow: inset 0 0 0 2px var(--cap), 0 0 0 3px color-mix(in srgb, var(--cap) 24%, transparent); }

/* ── 내보낼 형식 — 표본률 · 비트 깊이 눈금 스위치(X-AXIS와 같은 부품) ─────────── */
.export-format { display: flex; flex-wrap: wrap; gap: 12px 36px; margin-bottom: 16px; }
.export-pick { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 14px; min-width: 0; }
.export-pick-label { font-family: var(--font-legend); font-size: var(--fs-xs); font-weight: 600; letter-spacing: 0.06em; color: var(--muted); min-width: 88px; }
.export-pick-note { font-family: var(--font-body); font-size: var(--fs-xs); color: var(--muted); }
/* 눈금 세 개 · 다섯 개 — 기둥 간격(60 px)은 네 눈금과 같게 두고 폭만 바꾼다 */
.axis-switch.n3 { width: 136px; }
.axis-switch.n5 { width: 256px; }
/* 복원 모듈 — HD · Ultra · eXtreme HD · 비트 깊이 세 열, 좁으면 두 열 · 한 열로 흐른다.
   열이 좁아지면 이름과 값은 그대로 두고 슬라이더 막대만 줄인다 */
.hd-cols { grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); }
.hd-cols .slider-row input[type=range] { min-width: 0; }
.hd-badge.bits { background: color-mix(in srgb, var(--green) 12%, transparent); color: color-mix(in srgb, var(--green) var(--cap-ink), var(--text)); border: 1px solid color-mix(in srgb, var(--green) 40%, transparent); }

/* ── 카드 타일 (넓은 화면, ui.js가 .tiles를 붙인다) ─────────────────────────────
   높이가 들쭉날쭉한 카드를 빈틈 없이 쌓으면 순서가 지그재그로 흩어져 상자만 보고는 처리 순서를 알 수 없었다.
   같은 크기의 칸에 왼쪽→오른쪽 · 위→아래로 놓아 자리가 곧 처리 순서가 되게 한다 */
.dsp-grid.tiles { grid-auto-rows: auto; row-gap: 16px; align-items: start; --fx-tile-h: 385px; }   /* MACRO 줄 한 칸만큼 높임 — 넘치는 카드는 그대로 셋 */
.dsp-grid.tiles &gt; .module:not(.hd-module) { height: var(--fx-tile-h, 350px); display: flex; flex-direction: column; }
.dsp-grid.tiles &gt; .module.folded:not(.hd-module) { height: auto; }
.dsp-grid.tiles &gt; .module.grown:not(.hd-module) { height: auto; }       /* 늘인 카드 — 내용 높이만큼, 그 줄만 길어진다 */
.dsp-grid.tiles &gt; .module:not(.hd-module) &gt; .module-header { flex: 0 0 auto; }
.dsp-grid.tiles &gt; .module:not(.hd-module) &gt; .module-body { flex: 1 1 auto; min-height: 0; overflow: hidden; }
/* 켜진 카드만 안에서 스크롤한다. 넘치는 카드는 켜짐 · 꺼짐과 상관없이 스크롤바 자리를 늘 비워 켜고 꺼도 내용이 움찔하지 않는다 */
.dsp-grid.tiles &gt; .module.on:not(.hd-module) &gt; .module-body { overflow-y: auto; }
.dsp-grid.tiles &gt; .module.fx-ovf:not(.hd-module) &gt; .module-body { scrollbar-gutter: stable; }
/* 넘치는 카드의 본문을 끝까지 굴린 뒤 더 굴려도 화면으로 넘기지 않는다. 넘기면 화면이 올라가 카드 아래쪽이
   위에 붙은 이동 바 · 재생 줄 밑으로 들어가, 아래쪽 손잡이를 누르면 재생 줄이 눌렸다 */
.dsp-grid.tiles &gt; .module.on.fx-ovf:not(.hd-module) &gt; .module-body { overscroll-behavior: contain; }
/* 스크롤바 22px — 화살표 없이. 평소엔 손잡이 양옆을 비워 가볍게, 올리면 폭을 꽉 채운다 */
.dsp-grid.tiles &gt; .module &gt; .module-body::-webkit-scrollbar { width: 22px; }
.dsp-grid.tiles &gt; .module &gt; .module-body::-webkit-scrollbar-button { display: none; width: 0; height: 0; }
.dsp-grid.tiles &gt; .module &gt; .module-body::-webkit-scrollbar-track { background: color-mix(in srgb, var(--border) 55%, transparent); border-radius: 11px; margin: 8px 0; }
.dsp-grid.tiles &gt; .module &gt; .module-body::-webkit-scrollbar-thumb { background: color-mix(in srgb, var(--muted) 75%, transparent); border-radius: 11px; border: 4px solid transparent; background-clip: padding-box; min-height: 40px; }
.dsp-grid.tiles &gt; .module &gt; .module-body::-webkit-scrollbar-thumb:hover { border-width: 1px; background-color: color-mix(in srgb, var(--muted) 90%, transparent); }
/* 타일의 슬라이더 막대는 범위 입력의 기본 폭(129px) 밑으로도 줄어든다(HD 카드와 같은 방식). 3열이 막 시작되는 폭에서는
   카드가 360px까지 좁아지고 넘치는 카드는 스크롤바 자리 22px를 비우는데, 막대가 129px에 걸려 줄이 안쪽 여백을 넘고
   값 칸이 오른쪽에서 최대 12px 잘렸다 */
.dsp-grid.tiles &gt; .module &gt; .module-body .slider-row input[type=range] { min-width: 0; }
/* 꺼진 카드는 배경 — 본문은 inert(ui.js)로 비활성이 되어 휠이 화면을 굴리고, 색을 빼 물러난다. 제목줄(켜기 · 끌기 · 접기)은 그대로 */
.dsp-grid &gt; .module:not(.on):not(.hd-module) &gt; .module-body { opacity: 0.7; filter: saturate(.4); }
/* 끌어 옮기는 동안 — 자리 표시가 들어오면 끌던 카드는 빠지고 그 자리에 타일 크기 빈칸이 생긴다 */
.dsp-grid.tiles:has(&gt; .drop-indicator) &gt; .module.dragging { display: none; }
.dsp-grid.tiles &gt; .drop-indicator { width: auto; height: var(--fx-tile-h, 350px); min-height: 0; margin: 0; align-self: start;
  background: color-mix(in srgb, var(--amber) 7%, transparent); border: 2px dashed var(--amber); border-radius: 6px; box-shadow: none; }
/* 놓은 카드가 화면 오른쪽 끝에서 출발하면 잠깐 화면 밖으로 삐져나가 페이지 가로 스크롤바가 깜빡였다.
   clip은 스크롤 상자를 만들지 않아 위에 붙는 막대(sticky)는 그대로 동작한다 */
html, body { overflow-x: clip; }
/* 화면 스크롤 이어가기 — 화면을 굴리는 동안(ui.js가 .scroll-latch를 붙임) 켜진 카드 본문이 휠을 받지 않는다 */
.dsp-grid.tiles.scroll-latch &gt; .module.on &gt; .module-body { pointer-events: none; }

/* ── 재생 단계 — MASTER 뒤 (VINYL · ATMOS) ─────────────────────────────────
   MASTER 뒤는 마스터링이 끝난 소리를 재생 매체로 듣는 단계다. 청록 한 가지로 경계 · 구역 · 카드 · 노드를 묶어
   어떤 카드가 MASTER 뒤에서 처리되는지 한눈에 보이게 한다. 비어 있음은 투명도가 아니라 점선으로 구별한다(대비 유지) */
:root { --post: #5fc9b9; }
@media (prefers-color-scheme: light) { :root:not([data-theme=&quot;dark&quot;]) { --post: #17695f; } }
:root[data-theme=&quot;light&quot;] { --post: #17695f; }
.dsp-grid &gt; .post-zone { grid-column: 1 / -1; display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 14px; padding: 10px 14px;
  border: 1px solid var(--post); border-radius: 6px; background: color-mix(in srgb, var(--post) 8%, var(--panel)); color: var(--muted); font-size: 13px; line-height: 1.5; }
.post-zone .pz-title { color: var(--post); font-weight: 600; letter-spacing: .06em; white-space: nowrap; }
.post-zone.empty { border-style: dashed; padding-top: 16px; padding-bottom: 16px; }
.post-zone.deny { border-color: var(--danger-text); background: color-mix(in srgb, var(--red) 10%, var(--panel)); color: var(--danger-text); }
.post-zone.deny .pz-title { color: var(--danger-text); }
.module.post-stage { box-shadow: inset 0 3px 0 var(--post); }
.module.post-stage .module-name[data-pos]::before { background: var(--post); color: var(--panel); }
/* 처리 위치 띠 — 제목줄 아래, 본문 밖이라 카드가 꺼져 있어도 누를 수 있다 */
.post-place { display: flex; align-items: center; gap: 0; padding: 6px 14px; border-bottom: 1px solid color-mix(in srgb, var(--muted) 25%, transparent); font-size: 12px; color: var(--muted); }
.post-place .pp-label { margin-right: 10px; }
.post-place .pp-btn { appearance: none; border: 1px solid color-mix(in srgb, var(--muted) 60%, transparent); background: transparent; color: var(--muted); font: inherit; padding: 3px 10px; cursor: pointer; }
.post-place .pp-btn:first-of-type { border-radius: 4px 0 0 4px; }
.post-place .pp-btn:last-of-type { border-radius: 0 4px 4px 0; margin-left: -1px; }
.post-place .pp-btn[aria-pressed=&quot;true&quot;] { background: var(--post); border-color: var(--post); color: var(--panel); }
.post-place .pp-btn:focus-visible { outline: 2px solid var(--post); outline-offset: 1px; }
.dsp-grid.tiles &gt; .module:not(.hd-module) &gt; .post-place { flex: 0 0 auto; }
/* 흐름 지도 — 재생 단계의 시작 경계와 재생 단계 노드 */
.flow-post-mark { display: inline-flex; align-items: center; align-self: stretch; margin: 0 4px 0 10px; padding-left: 8px; border-left: 2px solid var(--post);
  color: var(--post); font-size: 11px; letter-spacing: .08em; white-space: nowrap; }
.flow-post-mark.empty { border-left-style: dashed; }
.flow-post-mark.deny { color: var(--danger-text); border-left-color: var(--danger-text); }
.flow-node.post { border-color: var(--post) !important; }
.flow-node.post .flow-num { color: var(--post); }
.module.folded &gt; .post-place { display: none; }          /* 접으면 제목줄만 — 자리는 청록 위 테두리와 재생 단계 구역으로 보인다 */

/* ── 켜짐 효과 · 네온 ─────────────────────────────────────────
   켜진 이펙터는 테두리가 네온처럼 빛난다. 야간은 흰빛이 섞인 가는 관(테두리)과 캡 색 빛무리(바깥 두 겹 · 안쪽 한 겹),
   주간은 밝은 바탕에서 흰 관 · 짙은 번짐이 탁해 보여 캡 색 테두리와 옅은 빛무리. 움직이지 않는 빛이다.
   카드의 안쪽 빛은 머리줄 바탕에 가리지 않게 카드 맨 위 층(::after)에 그린다. HD 복원 카드는 LIVE가 재생에 걸린 동안 빛난다.
   재생 단계 노드는 테두리가 청록이라 빛도 청록, 재생 단계 카드는 위 청록 선(--card-inset)을 그대로 둔다.
   켜고 끄는 움직임(누르는 동안 깜빡임 · 떼는 순간 퍼지는 빛 · 네온 번짐)은 ui.js가 붙였다 뗀다. 그동안의 상태는 data-ign —
   busy 효과 중 · hold 네온이 번지는 동안 제 켜진 모양을 미룸 · snap 넘겨받을 때 전환 없이 바로(겹친 층과 빛무리가 두 겹이 되지 않게) */
.dsp-grid &gt; .module, .fx-neon, .flow-node {
  --neon-c: var(--cap);
  --neon-line: color-mix(in srgb, var(--neon-c) 70%, white);
  --neon-out: 0 0 0 1px color-mix(in srgb, var(--neon-c) 50%, transparent), 0 0 12px color-mix(in srgb, var(--neon-c) 45%, transparent), 0 0 30px color-mix(in srgb, var(--neon-c) 20%, transparent);
  --neon-in: inset 0 0 12px color-mix(in srgb, var(--neon-c) 16%, transparent);
}
.flow-node {
  --neon-out: 0 0 0 1px color-mix(in srgb, var(--neon-c) 45%, transparent), 0 0 10px color-mix(in srgb, var(--neon-c) 42%, transparent);
  --neon-in: inset 0 0 6px color-mix(in srgb, var(--neon-c) 18%, transparent);
}
.flow-node.post { --neon-c: var(--post); --neon-line: var(--post); }
@media (prefers-color-scheme: light) {
  :root:not([data-theme=&quot;dark&quot;]) .dsp-grid &gt; .module, :root:not([data-theme=&quot;dark&quot;]) .fx-neon {
    --neon-line: var(--neon-c);
    --neon-out: 0 0 0 1px color-mix(in srgb, var(--neon-c) 30%, transparent), 0 0 12px color-mix(in srgb, var(--neon-c) 28%, transparent), 0 0 26px color-mix(in srgb, var(--neon-c) 14%, transparent);
    --neon-in: inset 0 0 10px color-mix(in srgb, var(--neon-c) 9%, transparent);
  }
  :root:not([data-theme=&quot;dark&quot;]) .flow-node {
    --neon-line: var(--neon-c);
    --neon-out: 0 0 0 1px color-mix(in srgb, var(--neon-c) 28%, transparent), 0 0 8px color-mix(in srgb, var(--neon-c) 26%, transparent);
    --neon-in: inset 0 0 5px color-mix(in srgb, var(--neon-c) 10%, transparent);
  }
}
:root[data-theme=&quot;light&quot;] .dsp-grid &gt; .module, :root[data-theme=&quot;light&quot;] .fx-neon {
  --neon-line: var(--neon-c);
  --neon-out: 0 0 0 1px color-mix(in srgb, var(--neon-c) 30%, transparent), 0 0 12px color-mix(in srgb, var(--neon-c) 28%, transparent), 0 0 26px color-mix(in srgb, var(--neon-c) 14%, transparent);
  --neon-in: inset 0 0 10px color-mix(in srgb, var(--neon-c) 9%, transparent);
}
:root[data-theme=&quot;light&quot;] .flow-node {
  --neon-line: var(--neon-c);
  --neon-out: 0 0 0 1px color-mix(in srgb, var(--neon-c) 28%, transparent), 0 0 8px color-mix(in srgb, var(--neon-c) 26%, transparent);
  --neon-in: inset 0 0 5px color-mix(in srgb, var(--neon-c) 10%, transparent);
}
/* 카드 — 켜지고 꺼질 때 네온이 0.25초에 걸쳐 오르내리고, 꺼진 카드의 흐린 본문도 0.3초에 걸쳐 밝아진다 */
.dsp-grid &gt; .module { --card-inset: inset 0 1px 0 var(--hilite); transition: border-color .25s, box-shadow .25s; }
.dsp-grid &gt; .module.post-stage { --card-inset: inset 0 3px 0 var(--post); }
.dsp-grid &gt; .module.on:not(.hd-module):not([data-ign~=&quot;hold&quot;]), #mod-hd.live-active { border-color: var(--neon-line); box-shadow: var(--card-inset), var(--neon-out); }
.dsp-grid &gt; .module::after {
  content: &#x27;&#x27;; position: absolute; inset: 0; border-radius: calc(var(--r-card) - 1px); pointer-events: none; z-index: 2;
  box-shadow: var(--neon-in); opacity: 0; transition: opacity .25s;
}
.dsp-grid &gt; .module.on:not(.hd-module):not([data-ign~=&quot;hold&quot;])::after, #mod-hd.live-active::after { opacity: 1; }
.dsp-grid &gt; .module:not(.hd-module) &gt; .module-body { transition: opacity .3s, filter .3s; }
/* 흐름 지도 노드 — 끄는 동안은 끌기 그림자를 쓰므로 네온을 쉰다 */
.flow-node.on:not(.dragging):not([data-ign~=&quot;hold&quot;]) { border-color: var(--neon-line); box-shadow: var(--neon-out), var(--neon-in); }
.flow-led { position: relative; }
.flow-node &gt; button { position: relative; z-index: 1; }   /* 번지는 바탕(.ign-fill-wrap) 위에 */

/* 켜고 끄는 효과 — 상태 */
.dsp-grid &gt; .module[data-ign~=&quot;busy&quot;] { z-index: 1; }
.flow-node[data-ign~=&quot;busy&quot;] { z-index: 2; }               /* 퍼지는 빛이 이웃 노드 · 전선 위로 지나가게 */
.dsp-grid &gt; .module[data-ign~=&quot;busy&quot;] .module-header-right .led-btn::after,
.flow-node[data-ign~=&quot;busy&quot;] .flow-led::before { transition: none; }   /* 점의 움직임은 효과가 맡는다 */
.dsp-grid &gt; .module[data-ign~=&quot;hold&quot;] { border-color: var(--border); box-shadow: var(--card-inset); }
.dsp-grid &gt; .module[data-ign~=&quot;hold&quot;]::after { opacity: 0; }
.flow-node[data-ign~=&quot;hold&quot;] { border-color: var(--border-hi); background: var(--panel); box-shadow: none; }
.dsp-grid &gt; .module[data-ign~=&quot;snap&quot;], .dsp-grid &gt; .module[data-ign~=&quot;snap&quot;]::after, .flow-node[data-ign~=&quot;snap&quot;] { transition: none; }
/* 번지는 층 — 둥근 가림(mask)은 제 상자 안에만 그려지므로, 빛무리 여유만큼 큰 틀에 담는다(노드 14px · 카드 40px).
   카드는 모서리를 잘라 그려(overflow: hidden) 안쪽 요소의 빛이 테두리 밖으로 나가지 못해, 카드판에 잠깐 겹쳐 놓는다 */
.flow-node &gt; .ign-fill-wrap { position: absolute; inset: -15px; border-radius: inherit; pointer-events: none; z-index: 0; }
.ign-fill {
  position: absolute; inset: 14px; border-radius: inherit; border: 1px solid var(--neon-line);
  background: color-mix(in srgb, var(--cap) 13%, var(--panel)); box-shadow: var(--neon-out), var(--neon-in);
}
.flow-node.fixed .ign-fill { border-style: dashed; }
.fx-neon-wrap { position: absolute; pointer-events: none; z-index: 3; }
.fx-neon {
  position: absolute; inset: 40px; box-sizing: border-box; border: 1px solid var(--neon-line); border-radius: var(--r-card);
  box-shadow: var(--neon-out), var(--neon-in);
}
.fx-wash { position: absolute; border-radius: 50%; pointer-events: none; z-index: 2; }
/* 떼는 순간 — 충격파 고리 · 빛 번짐 · 불티 */
.ign-ring, .ign-glow, .ign-spark { position: absolute; left: 50%; top: 50%; pointer-events: none; border-radius: 50%; z-index: 3; }
.ign-ring { width: 12px; height: 12px; margin: -6px 0 0 -6px; border: 2px solid var(--cap); }
.ign-glow {
  width: 14px; height: 14px; margin: -7px 0 0 -7px;
  background: radial-gradient(circle, color-mix(in srgb, var(--cap) 70%, white) 0%, color-mix(in srgb, var(--cap) 50%, transparent) 38%, transparent 70%);
}
.ign-spark { width: 3px; height: 3px; margin: -1.5px 0 0 -1.5px; background: color-mix(in srgb, var(--cap) 55%, white); }
@media (prefers-color-scheme: light) {
  :root:not([data-theme=&quot;dark&quot;]) .ign-glow { background: radial-gradient(circle, color-mix(in srgb, var(--cap) 30%, transparent) 0%, color-mix(in srgb, var(--cap) 12%, transparent) 45%, transparent 70%); }
  :root:not([data-theme=&quot;dark&quot;]) .ign-spark { background: var(--cap); }
}
:root[data-theme=&quot;light&quot;] .ign-glow { background: radial-gradient(circle, color-mix(in srgb, var(--cap) 30%, transparent) 0%, color-mix(in srgb, var(--cap) 12%, transparent) 45%, transparent 70%); }
:root[data-theme=&quot;light&quot;] .ign-spark { background: var(--cap); }

/* ── 단추 물결 ─────────────────────────────────────────────
   누르면 누른 자리에 물방울이 떨어져 원형 파동이 퍼지고 단추 안에서 잦아든다(ui.js가 붙였다 뗀다).
   단추를 따로 쌓는 층(isolation)으로 만들어 물결을 바탕 위 · 글자 아래(z-index −1)에 그리고, 단추 모양대로 잘라 밖으로 나가지 않게 한다.
   색은 단추 글자색(currentColor)을 옅게 — 호박색 단추는 짙은 물결, 어두운 단추는 밝은 물결. :where는 단추의 원래 배치 규칙을 이기지 않게 */
:where(.btn, .slot-btn, .sg-mode-btn, .atmos-scene-btn) { position: relative; isolation: isolate; }
.ripple-fx { position: absolute; inset: 0; border-radius: inherit; overflow: hidden; pointer-events: none; z-index: -1; }
.ripple-fx &gt; span { position: absolute; border-radius: 50%; pointer-events: none; }
.ripple-ring { box-sizing: border-box; border: 2px solid color-mix(in srgb, currentColor 55%, transparent); }
.ripple-wash { background: radial-gradient(closest-side, color-mix(in srgb, currentColor 16%, transparent), color-mix(in srgb, currentColor 6%, transparent) 70%, transparent); }
.ripple-drop { background: radial-gradient(closest-side, color-mix(in srgb, currentColor 85%, white), color-mix(in srgb, currentColor 40%, transparent) 70%, transparent); }

/* ── 값 막대 미끄러짐 — 단추가 바꾼 막대는 값은 끝 값 그대로 두고 손잡이만 앞 자리에서 옮겨 그린다(ui.js가 --glide-dx를 0으로 줄여 감) ── */
input[type=range]::-webkit-slider-thumb { transform: translateX(var(--glide-dx, 0px)); }
input[type=range]::-webkit-slider-thumb:hover { transform: translateX(var(--glide-dx, 0px)) scale(1.15); }
input[type=range]::-moz-range-thumb { transform: translateX(var(--glide-dx, 0px)); }
&lt;/style&gt;

          &lt;p id=&quot;masterZeroShort&quot;&gt;0 %라도 크게 만든 곡은 최대 약 0.9 dB 작아집니다. 원치 않으면 카드를 끄세요 — 끄면 출력 천장도 꺼집니다. &lt;button type=&quot;button&quot; class=&quot;mz-more&quot; id=&quot;masterZeroMore&quot; aria-expanded=&quot;false&quot; aria-controls=&quot;masterZeroLong&quot;&gt;자세히…&lt;/button&gt;&lt;/p&gt;

async function readStaticUIFromCache(scopeURL) {
  if (typeof caches === 'undefined') return '';
  const marker = ':' + encodeURIComponent(scopeURL) + ':';
  const uiURL = new URL('./pwa-ui.html', scopeURL).href;
  const names = (await caches.keys()).filter(name => name.startsWith('velvitty-pwa:') && name.includes(marker) && name.endsWith(':shell')).reverse();
  for (const cacheName of names) {
    const response = await caches.match(uiURL, {cacheName});
    if (response?.ok) {
      const html = await response.text();
      if (html.trim()) return html;
    }
  }
  return '';
}

  const middleTone = 1 - Math.abs(brightness * 2 - 1);
  glass.style.setProperty('--glass-alpha', (.055 + .075 * middleTone).toFixed(3));
  glass.style.setProperty('--glass-rgb', light ? '255 255 255' : '12 12 12');
  glass.style.setProperty('--glass-shadow-opacity', (.42 - .16 * brightness).toFixed(3));
}
